<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Lotto Lab - Battles</title>
<script src="common.js?v=20260710a"></script>
<script src="https://my-lotto-lab-api.onrender.com/pay/auth_gate.js"></script>
<script>
// =====================================================
// Battles - 무제한 대결(FFA) 전용 (2026-08-13 전면 개편)
// ⚠️ 예전 1:1 대결/팀전/토너먼트는 서비스 종료되어 관련 코드를 전부 삭제했습니다.
// ⚠️ "방(room)" 개념도 화면에서 제거했습니다 — 회차마다 시스템이 자동으로 여는 단일
// 컨테이너(백엔드에서는 여전히 room으로 존재)를 사용자에게는 그냥 "이번 회차 참가 현황"
// 하나로만 보여줍니다. ROUND1_TS/getLottoInfo/loadResults 등은 common.js가 제공합니다.
// =====================================================
if (typeof window.MLL === 'undefined') { window.MLL = {}; }
var MLL = window.MLL;

var BATTLE = {};

// 1단위(100P) = 조합 100개를 등록·채점받을 수 있는 권리(=정산 기준 단위).
// 1인당 회차별 최대 1,000단위(=최대 100,000개 조합)까지 구매 가능.
BATTLE.UNIT_PRICE = 100;
BATTLE.MAX_UNITS = 1000; // ⚠ 2026-08-13: 100 → 1,000으로 수정 (PaperLotto는 별도 파일에서 10,000단위/1,000,000개)
BATTLE.COMBOS_PER_UNIT = 100;

BATTLE.requireAuth = function(){
  var state = MLL.getAuthState();
  if (!state || !state.type) {
    if (window.MLL.requireAuth) MLL.requireAuth(function(){});
    else alert(LANG==='en' ? 'Please log in first.' : '먼저 로그인해주세요.');
    return null;
  }
  return state;
};
BATTLE._authRequest = async function(state, body){
  body = body || {};
  var headers = { 'Content-Type': 'application/json' };
  if (state.type === 'member') {
    var freshToken = await MLL.ensureFreshToken();
    if (!freshToken || freshToken === 'guest') return null;
    headers['Authorization'] = 'Bearer ' + freshToken;
  } else {
    body.nickname = state.nickname; body.email = state.email;
  }
  return { headers: headers, body: body };
};

BATTLE._handleFail = async function(resp){
  var data = await resp.json().catch(function(){ return {}; });
  if (resp.status === 402) {
    var balance = (data.balance && data.balance.total) || 0;
    alert((LANG==='en'?'Not enough points.\nBalance: ':'포인트가 부족합니다.\n현재 잔액: ')+balance.toLocaleString()+(LANG==='en'?'\nShortfall: ':'\n부족한 포인트: ')+(data.shortfall||0).toLocaleString());
  } else {
    alert('⚠️ ' + (data.error || ('오류 (코드 ' + resp.status + ')')));
  }
  return false;
};

BATTLE._viewerFetch = async function(url){
  var state = MLL.getAuthState();
  var headers = {};
  var finalUrl = url;
  if (state && state.type === 'member') {
    var freshToken = await MLL.ensureFreshToken();
    if (freshToken && freshToken !== 'guest') headers['Authorization'] = 'Bearer ' + freshToken;
  } else if (state && state.type === 'guest') {
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    finalUrl = url + sep + 'nickname=' + encodeURIComponent(state.nickname) + '&email=' + encodeURIComponent(state.email);
  }
  // cache:'no-store' — 구매/제출 직후 브라우저 캐시된 옛날 응답이 아니라 항상 최신 데이터를 받는다.
  return fetch(finalUrl, { headers: headers, cache: 'no-store' });
};

// 현재 회차에 열려있는 FFA 컨테이너를 찾는다(항상 최대 1개 — 사용자에게는 "방"이라 부르지 않는다).
BATTLE.getCurrentRound = async function(){
  try {
    var resp = await BATTLE._viewerFetch(MLL.API_BASE + '/api/battles/rooms?status=waiting&type=ffa');
    var data = await resp.json();
    return (data.items && data.items[0]) || null;
  } catch(e) { console.error('[BATTLE] 회차 조회 오류:', e); return null; }
};

BATTLE.getRoom = async function(roomId){
  try {
    var resp = await BATTLE._viewerFetch(MLL.API_BASE + '/api/battles/rooms/' + roomId);
    if (!resp.ok) return null;
    var data = await resp.json();
    return data.room;
  } catch(e) { console.error('[BATTLE] 상세 조회 오류:', e); return null; }
};

BATTLE.buyUnits = async function(roomId, units){
  var state = BATTLE.requireAuth();
  if (!state) return { ok:false, cancelled:true };
  var req = await BATTLE._authRequest(state, { units: units });
  if (!req) { alert(LANG==='en' ? 'Your session has expired. Please log in again.' : '로그인이 만료됐습니다. 다시 로그인해주세요.'); return { ok:false }; }
  try {
    var resp = await fetch(MLL.API_BASE + '/api/battles/rooms/' + roomId + '/buy-units', { method:'POST', headers:req.headers, body:JSON.stringify(req.body) });
    if (!resp.ok) { await BATTLE._handleFail(resp); return { ok:false }; }
    var data = await resp.json();
    return { ok:true, room:data.room, unitsBought:data.unitsBought };
  } catch(e) {
    alert((LANG==='en'?'Network error: ':'네트워크 오류: ')+e.message);
    return { ok:false };
  }
};

BATTLE.submitCombos = async function(roomId, combosArr){
  var state = BATTLE.requireAuth();
  if (!state) return { ok:false, cancelled:true };
  var req = await BATTLE._authRequest(state, { combos: combosArr, final: false });
  if (!req) { alert(LANG==='en' ? 'Your session has expired. Please log in again.' : '로그인이 만료됐습니다. 다시 로그인해주세요.'); return { ok:false }; }
  try {
    var resp = await fetch(MLL.API_BASE + '/api/battles/rooms/' + roomId + '/submit', { method:'POST', headers:req.headers, body:JSON.stringify(req.body) });
    if (!resp.ok) { await BATTLE._handleFail(resp); return { ok:false }; }
    var data = await resp.json();
    return { ok:true, room:data.room };
  } catch(e) {
    alert((LANG==='en'?'Network error: ':'네트워크 오류: ')+e.message);
    return { ok:false };
  }
};
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d18; --surface:#11152a; --surface-2:#161b35;
  --border:#252b48; --border-soft:#1b2038;
  --text:#eef0f6; --text-dim:#8b91ab; --text-faint:#5a6080;
  --gold:#e0b341; --gold-dim:#8a6f2f;
  --accent:#e8732f; --accent-bg:rgba(232,115,47,.13);
  --indigo:#5b6ee8; --indigo-dim:#2a3270;
  --green:#3fb37f; --red:#d4537e; --blue:#5b9bd5;
  --card-shadow:0 1px 2px rgba(0,0,0,.2); --card-shadow-hover:0 8px 20px rgba(0,0,0,.32);
  --bg-top:#0d1120;
}
body.light-mode{
  --bg:#dbe0ee; --surface:#ffffff; --surface-2:#eef1f9;
  --border:#c2c8dd; --border-soft:#d2d7e8;
  --text:#161b30; --text-dim:#4c5372; --text-faint:#7a80a0;
  --gold:#a8781f; --gold-dim:#8a6f2f;
  --accent:#c65a1f; --accent-bg:rgba(198,90,31,.10);
  --indigo:#4453c9; --indigo-dim:#c7cdf5;
  --green:#178072; --red:#b8436a; --blue:#3c78b0;
  --card-shadow:0 1px 2px rgba(30,36,66,.06); --card-shadow-hover:0 10px 24px rgba(30,36,66,.12);
  --bg-top:#e7eaf5;
}
body{background:var(--bg);background-image:linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 340px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;font-size:14px;letter-spacing:-0.01em;min-height:100vh;}
.font-num{font-variant-numeric:tabular-nums;}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;flex-shrink:0;}
.theme-toggle:hover{border-color:var(--accent);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

.topbar{border-bottom:1px solid var(--border-soft);}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #f3d785, var(--gold) 60%, var(--gold-dim));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.brand-text .t1{font-size:15px;font-weight:600;letter-spacing:-0.02em;}
.brand-text .t2{font-size:10px;color:var(--text-faint);margin-top:1px;}

.wrap{max-width:900px;margin:0 auto;padding:24px;}

.page-head{margin-bottom:20px;}
.page-title{font-size:23px;font-weight:600;letter-spacing:-0.02em;}
.page-sub{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.6;max-width:600px;}
.btn{border:none;border-radius:9px;padding:10px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-gold{background:var(--gold);color:#1a1404;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text-dim);}
.btn-outline:hover{border-color:var(--gold-dim);color:var(--text);}
.btn:disabled{opacity:.45;cursor:default;}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:20px;margin-bottom:16px;}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;}

.form-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.form-row label{font-size:12px;color:var(--text-dim);font-weight:600;min-width:80px;}
.inp{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 12px;font-size:12.5px;outline:none;}

.result-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
.result-badge.win{background:rgba(63,179,127,.18);color:var(--green,#3fb37f);}
.result-badge.lose{background:rgba(224,80,80,.15);color:#e05050;}
.result-badge.draw{background:rgba(224,179,65,.15);color:var(--gold,#e0b341);}

.all-rooms-table{width:100%;border-collapse:collapse;font-size:12px;}
.all-rooms-table th{text-align:left;padding:10px 14px;color:var(--text-faint);font-size:11px;font-weight:700;border-bottom:1px solid var(--border-soft);}
.all-rooms-table td{padding:10px 14px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
.all-rooms-table tr:last-child td{border-bottom:none;}

.status-tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;}
.status-waiting{background:rgba(91,156,213,.15);color:var(--blue);}
.status-active{background:rgba(63,179,127,.15);color:var(--green);}
.status-completed{background:var(--surface-2);color:var(--text-faint);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);font-size:13px;}

.ball-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:14px;}
.ball-btn{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ball-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

.participant-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-bottom:6px;font-size:12px;}
.participant-row.winner{border:1px solid var(--gold);background:rgba(224,179,65,.08);}

.history-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.history-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;cursor:pointer;}
.history-card:hover{border-color:var(--accent);}
.history-card .hc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.history-card .hc-name{font-size:13px;font-weight:700;}
.history-card .hc-meta{font-size:11px;color:var(--text-faint);}

/* ── 내 베팅현황: 방 개념을 없애고 진행바+숫자로만 표시 ── */
.bstat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 4px;}
.bstat{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:11px;padding:12px 14px;}
.bstat .bs-num{font-size:20px;font-weight:700;line-height:1;}
.bstat .bs-label{font-size:10.5px;color:var(--text-faint);margin-top:6px;font-weight:600;}
.progress-track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--gold-dim), var(--gold));border-radius:6px;transition:width .25s;}
.progress-caption{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-top:5px;}

.admin-lock{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px;color:var(--text-faint);}
.admin-lock input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;font-size:13px;text-align:center;}

@media (max-width:680px){
  .topbar-inner{height:auto;min-height:56px;padding:10px 14px;flex-wrap:wrap;gap:8px 0;}
  .brand{gap:8px;}
  .brand-mark{width:28px;height:28px;font-size:13px;}
  .brand-text .t1{font-size:13px;}
  .brand-text .t2{display:none;}

  .wrap{padding:14px;}
  .page-head{gap:10px;}
  .page-title{font-size:19px;}

  .card{padding:14px;}
  .form-row label{min-width:100%;}
  .ball-grid{grid-template-columns:repeat(7,1fr);}
  .history-list{grid-template-columns:1fr;}
  .card:has(.all-rooms-table){overflow-x:auto;}
  .all-rooms-table{min-width:420px;}
}
</style>

<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="location.href='main_page.html'">
      <div class="brand-mark">⚔️</div>
      <div class="brand-text"><div class="t1">My Lotto Lab — Battles</div><div class="t2" data-i18n-kr="무제한 대결 — 인원 제한 없이 자유 참가" data-i18n-en="Free-for-all battles — open to anyone">무제한 대결 — 인원 제한 없이 자유 참가</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="야간/주간 모드 전환">🌙</button>
      <div class="lang-toggle" style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
        <button id="langKrBtn" onclick="setLang('kr')" style="background:var(--gold);color:#1a1305;border:none;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;">KR</button>
        <button id="langEnBtn" onclick="setLang('en')" style="background:var(--surface);color:var(--text-dim);border:none;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;">EN</button>
      </div>
      <button class="btn btn-outline" onclick="location.href='main_page.html'">← <span data-i18n-kr="메인으로" data-i18n-en="Back to Main">메인으로</span></button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">⚔️ Battles</div>
    <div class="page-sub" data-i18n-kr="회차마다 번호조합을 등록하고, 추첨 결과에 따른 당첨금 합계로 순위를 가리는 무제한 대결입니다." data-i18n-en="Register number combos each round — the draw result decides the ranking by total prize.">회차마다 번호조합을 등록하고, 추첨 결과에 따른 당첨금 합계로 순위를 가리는 무제한 대결입니다.</div>

  <div id="pendingBanner"></div>

<script>
// =====================================================
// BUI - 화면 컨트롤러 (전면 개편: 모달 없이 한 페이지에 다 표시)
// =====================================================
var BUI = {};
BUI.state = { currentRoomId:null, selectedBalls:[], multiCombos:[], lastAddedCount:0, submitConfirmShown:false, submitRemaining:null };

BUI.init = async function(){ await BUI.loadAndRenderAll(); };

BATTLE._myNicknameCache = null;
BATTLE.getMyNickname = async function(){
  var state = MLL.getAuthState();
  if (!state || !state.type) return null;
  if (state.type === 'guest') return state.nickname;
  if (BATTLE._myNicknameCache) return BATTLE._myNicknameCache;
  try {
    var freshToken = await MLL.ensureFreshToken();
    if (!freshToken || freshToken === 'guest') return null;
    var resp = await fetch(MLL.API_BASE + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + freshToken } });
    if (!resp.ok) return null;
    var data = await resp.json();
    BATTLE._myNicknameCache = data.nickname;
    return data.nickname;
  } catch(e) { console.error('[BATTLE] 내 정보 조회 오류:', e); return null; }
};

BUI.pendingBannerHtml = function(){
  var info = MLL.getLottoInfo();
  if (info.status !== 'closing') return '';
  return '<div class="card" style="background:rgba(224,179,65,.08);border-color:var(--gold-dim);font-size:12px;color:var(--text-dim);text-align:center;padding:14px;">' +
    '⏳ <b style="color:var(--gold);">' + (LANG==='en'?'Awaiting draw & results':'추첨대기 및 결과작업중') + '</b> — ' + (LANG==='en'
      ? ('Round ' + info.thisRound + ' results are being tallied. Round ' + info.nextRound + ' battles open the moment results are in.')
      : ('제' + info.thisRound + '회 추첨 결과가 집계되는 중입니다. 결과 반영 즉시 제' + info.nextRound + '회 배틀 신청이 시작됩니다.')) +
  '</div>';
};

BUI.rulesCardHtml = function(){
  return '<h3 data-i18n-kr="💰 베팅/배당 방식" data-i18n-en="💰 Betting / Payout">💰 베팅/배당 방식</h3>' +
    (LANG==='en'
      ? '<div style="font-size:12px;line-height:1.7;color:var(--text-dim);">' +

          '등록 가능한 칸을 다 채우든 하나도 안 채우든 상관없이, <b style="color:var(--text);">산 단위 수 자체가 그대로 베팅액</b>입니다.<br>' +
          '추첨 후 <b style="color:var(--text);">당첨금 합계 1위</b>(동점이면 당첨개수 많은 쪽)가 우승 —<br>' +

          '<span style="color:var(--text-faint);">※ 혼자 참가한 회차는 낙첨자가 없어 베팅액이 그대로 전액 환불됩니다.</span>' +

// ── 전체 로딩/렌더 ──
BUI.loadAndRenderAll = async function(){
  document.getElementById('pendingBanner').innerHTML = BUI.pendingBannerHtml();
  document.getElementById('rulesCard').innerHTML = BUI.rulesCardHtml();

  var round = await BATTLE.getCurrentRound();
  if (!round) {
    BUI.state.currentRoomId = null;
    document.getElementById('myStatusCard').innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en'
      ? 'No round open for entry right now. Please check back shortly.'
      : '지금 참가 가능한 회차가 없습니다. 잠시 후 다시 확인해주세요.') + '</div></div>';
    document.getElementById('registerCard').innerHTML = '';
    document.getElementById('resultCard').innerHTML = '';
    document.getElementById('allParticipantsBody').innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en'?'No data.':'데이터가 없습니다.') + '</div></div>';
    document.getElementById('allParticipantsCount').textContent = '0';
  } else {
    BUI.state.currentRoomId = round.id;
    await BUI.renderCurrentRound();
  }

  await BUI.renderMyHistory();
};

BUI.renderCurrentRound = async function(){
  var room = await BATTLE.getRoom(BUI.state.currentRoomId);
  if (!room) return;
  var myParticipant = room.participants.find(function(p){ return p.isMe; });

  BUI.renderMyStatusCard(room, myParticipant);
  BUI.renderRegisterCard(room, myParticipant);
  document.getElementById('resultCard').innerHTML = room.status === 'completed' ? BUI.resultCardHtml(room) : '';
  BUI.renderAllParticipants(room);
};

// ── 내 베팅현황: "방" 대신 숫자+진행바로 한눈에 ──
BUI.renderMyStatusCard = function(room, myParticipant){
  var el = document.getElementById('myStatusCard');
  var state = MLL.getAuthState();
  var roundLabel = (LANG==='en' ? 'Round ' : '제') + room.round + (LANG==='en' ? '' : '회');

  if (!state || !state.type) {
    el.innerHTML = '<div class="card"><h3>' + roundLabel + '</h3><div class="empty-state" style="padding:20px;">' + (LANG==='en'
      ? 'Log in to buy units and register combos.'
      : '로그인하시면 단위를 구매하고 조합을 등록할 수 있습니다.') + '</div></div>';
    return;
  }

  var unitsBought = myParticipant ? (myParticipant.unitsBought || 0) : 0;
  var remainingUnits = BATTLE.MAX_UNITS - unitsBought;
  var alreadyCombos = myParticipant ? (myParticipant.comboCount || 0) : 0;
  var maxCombos = unitsBought * BATTLE.COMBOS_PER_UNIT;
  var stagedCount = BUI.state.multiCombos ? BUI.state.multiCombos.length : 0;
  var previewCombos = Math.min(maxCombos, alreadyCombos + stagedCount);
  var betAmount = unitsBought * BATTLE.UNIT_PRICE;
  var pct = maxCombos > 0 ? Math.min(100, Math.round((previewCombos / maxCombos) * 100)) : 0;

  var buyRowHtml = remainingUnits > 0
    ? ('<div class="form-row" style="margin-top:14px;">' +
        '<label>' + (LANG==='en'?'Units to buy':'구매할 단위 수') + '</label>' +
        '<input type="number" class="inp" id="buyUnitsInput" value="1" min="1" max="' + remainingUnits + '" style="width:100px;">' +
        '<button class="btn btn-gold" onclick="BUI.doBuyUnits()">💰 ' + (LANG==='en'?'Buy units':'단위 구매하기') + '</button>' +
        '<span style="font-size:10.5px;color:var(--text-faint);">' + (LANG==='en'
          ? ('up to ' + remainingUnits.toLocaleString() + ' more')
          : (remainingUnits.toLocaleString() + '단위까지 추가 가능')) + '</span>' +
      '</div>')
    : ('<div style="font-size:11.5px;color:var(--text-faint);margin-top:14px;">' + (LANG==='en'
        ? ('You\'ve reached the max (' + BATTLE.MAX_UNITS.toLocaleString() + ' units) for this round.')
        : ('이번 회차 최대 구매 한도(' + BATTLE.MAX_UNITS.toLocaleString() + '단위)에 도달했습니다.')) + '</div>');

  el.innerHTML = '<div class="card">' +
    '<h3>' + roundLabel + ' · ' + (LANG==='en'?'My status':'내 베팅현황') + '</h3>' +
    '<div class="bstat-grid">' +
      '<div class="bstat"><div class="bs-num font-num" style="color:var(--gold);">' + unitsBought.toLocaleString() + '</div><div class="bs-label">' + (LANG==='en'?'units bought':'구매 단위') + '</div></div>' +
      '<div class="bstat"><div class="bs-num font-num">' + betAmount.toLocaleString() + 'P</div><div class="bs-label">' + (LANG==='en'?'total bet':'총 베팅액') + '</div></div>' +
      '<div class="bstat"><div class="bs-num font-num">' + previewCombos.toLocaleString() + ' / ' + maxCombos.toLocaleString() + '</div><div class="bs-label">' + (LANG==='en'?'combos registered':'등록한 조합') + '</div></div>' +
    '</div>' +
    (maxCombos > 0 ? ('<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
      '<div class="progress-caption"><span>' + pct + '%</span><span>' + (LANG==='en'?'slots filled':'등록 완료율') + '</span></div>') : '') +
    buyRowHtml +
  '</div>';
};

BUI.doBuyUnits = async function(){
  var input = document.getElementById('buyUnitsInput');
  var units = parseInt(input.value) || 0;
  if (units < 1) { alert(LANG==='en' ? 'Please enter at least 1 unit.' : '1단위 이상 입력해주세요.'); return; }
  var result = await BATTLE.buyUnits(BUI.state.currentRoomId, units);
  if (!result.ok) return;
  await BUI.renderCurrentRound();
  await BUI.renderMyHistory();
};

// ── 번호조합 등록 ──
BUI.renderRegisterCard = function(room, myParticipant){
  var el = document.getElementById('registerCard');
  var state = MLL.getAuthState();
  if (!state || !state.type) { el.innerHTML = ''; return; }

  var unitsBought = myParticipant ? (myParticipant.unitsBought || 0) : 0;
  var alreadyCombos = myParticipant ? (myParticipant.comboCount || 0) : 0;
  var maxCombos = unitsBought * BATTLE.COMBOS_PER_UNIT;

  if (unitsBought === 0) {
    el.innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en'
      ? 'Buy units above first — a combo-registration screen will appear here.'
      : '먼저 위에서 단위를 구매하시면, 조합을 등록할 수 있는 화면이 여기 나타납니다.') + '</div></div>';
    return;
  }
  if (room.status === 'completed') { el.innerHTML = ''; return; }
  if (alreadyCombos >= maxCombos) {
    el.innerHTML = '<div class="card"><div style="font-size:12px;color:var(--green);text-align:center;">' + (LANG==='en'
      ? ('✓ You\'ve filled all ' + maxCombos.toLocaleString() + ' available slots.<br>Buy more units above if you\'d like to register more.')
      : ('✓ 등록 가능한 ' + maxCombos.toLocaleString() + '개를 모두 채우셨습니다.<br>더 등록하려면 위에서 단위를 추가로 구매해주세요.')) + '</div></div>';
    return;
  }
  el.innerHTML = BUI.comboWidgetHtml(alreadyCombos, maxCombos);
  if (document.getElementById('multiBallGrid')) {
    BUI.renderMultiBallGrid();
    BUI.renderMultiComboList();
  }
};

BUI.comboWidgetHtml = function(alreadySubmitted, maxCombos){
  var remaining = maxCombos - alreadySubmitted;
  BUI.state.submitRemaining = remaining;

  if (BUI.state.submitConfirmShown) {
    var staged = BUI.state.multiCombos.length;
    var total = alreadySubmitted + staged;
    return '<div class="card" style="border-color:var(--gold-dim);">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px;">' + (LANG==='en'
        ? ('Entered ' + total + ' of ' + maxCombos + ' (existing ' + alreadySubmitted + ' + now ' + staged + ') · ' + (maxCombos - total) + ' more slots available')
        : ('총 ' + maxCombos + '개 중 ' + total + '개 입력 (기존 ' + alreadySubmitted + '개 + 지금 ' + staged + '개) · 잔여 입력가능 ' + (maxCombos - total) + '개')) + '</div>' +
      '<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.6;">' + (LANG==='en'
        ? '⚠️ Once submitted, combos can\'t be <b style="color:var(--red);">edited or deleted</b> (like a lottery ticket you can\'t cancel after buying). You can still come back and add more any time before the deadline.'
        : '⚠️ 한 번 제출한 조합은 <b style="color:var(--red);">수정·삭제가 불가능</b>합니다 (복권을 한 번 사면 취소할 수 없는 것과 같아요). 마감 전까지 언제든 다시 들어와서 추가할 수 있어요.') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
        '<button class="btn btn-outline" onclick="BUI.cancelSubmitConfirm()">🔙 ' + (LANG==='en'?'Add more now':'지금 더 추가하기') + '</button>' +
        '<button class="btn btn-gold" onclick="BUI.confirmSubmit()">✅ ' + (LANG==='en'?'Submit (you can keep adding until the deadline)':'제출하기 (마감 전까지 계속 추가 가능)') + '</button>' +
      '</div>' +
    '</div>';
  }

  return '<div class="card">' +
    (alreadySubmitted > 0 ? '<div style="font-size:12px;color:var(--green);margin-bottom:10px;">✓ ' + (LANG==='en'
      ? (alreadySubmitted + ' already registered — you can keep adding until the deadline (up to ' + maxCombos + ')')
      : ('이미 ' + alreadySubmitted + '개 등록됨 — 마감 전까지 계속 추가할 수 있어요 (최대 ' + maxCombos + '개)')) + '</div>' : '') +
    '<h3>' + (LANG==='en' ? ('Register combos (' + remaining + ' more available)') : ('번호조합 등록 (잔여 ' + remaining + '개 가능)')) + '</h3>' +
    '<div class="form-row"><label>' + (LANG==='en'?'Auto-generate count':'자동 생성 개수') + '</label><input type="number" class="inp" id="multiGenCount" value="10" min="1" max="' + remaining + '" style="width:80px;"> <button class="btn btn-outline" onclick="BUI.addAutoCombos()">+ ' + (LANG==='en'?'Auto add':'자동 추가') + '</button></div>' +
    '<div class="form-row"><label>' + (LANG==='en'?'Pick manually':'직접 선택') + '</label><span style="font-size:11px;color:var(--text-faint);">' + (LANG==='en' ? 'Pick 6 balls below to add a combo' : '아래 공에서 6개를 고르면 조합이 1개씩 추가됩니다') + '</span></div>' +
    '<div class="ball-grid" id="multiBallGrid"></div>' +
    '<div id="multiComboList" style="margin-top:12px;"></div>' +
    '<div style="display:flex;gap:8px;margin-top:10px;">' +
      '<button class="btn btn-outline" style="flex:1;" id="quickSaveBtn" disabled onclick="BUI.quickSaveCombos()">💾 ' + (LANG==='en'?'Save now':'바로 저장') + '</button>' +
      '<button class="btn btn-gold" style="flex:1;" id="submitMultiPicksBtn" disabled onclick="BUI.openSubmitConfirm()">' + (LANG==='en'?'Review & Register':'검토 후 등록하기') + '</button>' +
    '</div>' +
    '<p style="font-size:10.5px;color:var(--text-faint);margin-top:6px;text-align:center;">' + (LANG==='en'
      ? '"Save now" instantly saves what you\'ve added — handy if you need to leave partway through.'
      : '"바로 저장"은 지금까지 담은 것을 확인 없이 즉시 저장합니다 — 중간에 나가야 할 때 유용해요.') + '</p>' +

BUI.quickSaveCombos = async function(){
  if (!BUI.state.multiCombos.length) return;
  var combos = BUI.state.multiCombos;
  var result = await BATTLE.submitCombos(BUI.state.currentRoomId, combos);
  if (!result.ok) return;
  BUI.state.multiCombos = [];
  BUI.state.lastAddedCount = 0;
  BUI.state.selectedBalls = [];
  alert(LANG==='en' ? ('💾 Saved ' + combos.length + ' combos.') : ('💾 ' + combos.length + '개 저장했습니다.'));
  await BUI.renderCurrentRound();
  await BUI.renderMyHistory();
};

BUI.openSubmitConfirm = function(){
  if (!BUI.state.multiCombos.length) { alert(LANG==='en' ? 'Please add at least 1 combo.' : '번호조합을 1개 이상 등록해주세요.'); return; }
  BUI.state.submitConfirmShown = true;
  BUI.rerenderRegisterCard();
};
BUI.cancelSubmitConfirm = function(){
  BUI.state.submitConfirmShown = false;
  BUI.rerenderRegisterCard();
};
BUI.rerenderRegisterCard = async function(){
  var room = await BATTLE.getRoom(BUI.state.currentRoomId);
  if (!room) return;
  var myParticipant = room.participants.find(function(p){ return p.isMe; });
  BUI.renderRegisterCard(room, myParticipant);
};
BUI.confirmSubmit = async function(){
  var combos = BUI.state.multiCombos;
  var result = await BATTLE.submitCombos(BUI.state.currentRoomId, combos);
  if (!result.ok) return;
  BUI.state.multiCombos = [];
  BUI.state.lastAddedCount = 0;
  BUI.state.selectedBalls = [];
  BUI.state.submitConfirmShown = false;
  alert(LANG==='en' ? '💾 Submitted! You can come back and add more any time before the deadline.' : '💾 지금까지 조합이 제출됐어요. 마감 전까지 언제든 다시 들어와서 추가하실 수 있습니다.');
  await BUI.renderCurrentRound();
  await BUI.renderMyHistory();
};

BUI.renderMultiBallGrid = function(){
  var el = document.getElementById('multiBallGrid');
  if (!el) return;
  var html = '';
  for (var n=1; n<=45; n++) {
    var on = BUI.state.selectedBalls.indexOf(n) >= 0;
    html += '<button class="ball-btn' + (on?' on':'') + '" onclick="BUI.toggleMultiBall(' + n + ')">' + n + '</button>';
  }
  el.innerHTML = html;
};
BUI.toggleMultiBall = function(n){
  var sel = BUI.state.selectedBalls;
  var idx = sel.indexOf(n);
  if (idx >= 0) { sel.splice(idx, 1); }
  else if (sel.length < 6) { sel.push(n); }
  if (sel.length === 6) {
    BUI.addCombo(sel.slice().sort(function(a,b){return a-b;}));
    BUI.state.selectedBalls = [];
  }
  BUI.renderMultiBallGrid();
};
BUI.addCombo = function(combo){
  var cap = BUI.state.submitRemaining != null ? BUI.state.submitRemaining : BATTLE.COMBOS_PER_UNIT;
  if (BUI.state.multiCombos.length >= cap) {
    alert(LANG==='en' ? ('You can add up to ' + cap + ' combos right now.') : ('지금 추가로 등록할 수 있는 조합은 최대 ' + cap + '개입니다.'));
    return;
  }
  BUI.state.multiCombos.push(combo);
  BUI.state.lastAddedCount = 1;
  BUI.renderMultiComboList();
};
BUI.removeCombo = function(idx){
  BUI.state.multiCombos.splice(idx, 1);
  BUI.state.lastAddedCount = 0;
  BUI.renderMultiComboList();
};
BUI.addAutoCombos = function(){
  var cap = BUI.state.submitRemaining != null ? BUI.state.submitRemaining : BATTLE.COMBOS_PER_UNIT;
  var countInput = document.getElementById('multiGenCount');
  var count = Math.max(1, Math.min(cap - BUI.state.multiCombos.length, parseInt(countInput.value)||1));
  if (cap - BUI.state.multiCombos.length <= 0) { alert(LANG==='en' ? ('You\'ve reached the current limit (' + cap + ') for adding combos.') : ('지금 추가로 등록할 수 있는 조합 한도(' + cap + '개)에 도달했어요.')); return; }
  for (var i=0;i<count;i++){
    var pool = []; for (var n=1;n<=45;n++) pool.push(n);
    var picked = [];
    while (picked.length < 6) { var idx = Math.floor(Math.random()*pool.length); picked.push(pool.splice(idx,1)[0]); }
    BUI.state.multiCombos.push(picked.sort(function(a,b){return a-b;}));
  }
  BUI.state.lastAddedCount = count;
  BUI.renderMultiComboList();
};
BUI.renderMultiComboList = function(){
  var el = document.getElementById('multiComboList');
  if (!el) return;
  var cap = BUI.state.submitRemaining != null ? BUI.state.submitRemaining : BATTLE.COMBOS_PER_UNIT;
  var combos = BUI.state.multiCombos;
  var lastAdded = BUI.state.lastAddedCount || 0;
  var indexed = combos.map(function(c, i){ return { combo: c, realIndex: i }; });
  indexed.reverse();
  var listHtml = indexed.map(function(item, displayIdx){
    var isNew = lastAdded > 0 && displayIdx < lastAdded;
    var rowStyle = isNew ? ' style="border:1.5px solid var(--gold);"' : '';
    var tag = isNew
      ? ('<span style="background:var(--gold);color:#1a1305;font-weight:800;font-size:10px;padding:2px 8px;border-radius:20px;margin-left:10px;white-space:nowrap;">[' + (LANG==='en'?'NEW ':'신규 ') + (item.realIndex+1) + ']</span>')
      : '';
    return '<div class="participant-row"' + rowStyle + '><span class="font-num">' + item.combo.join(', ') + tag + '</span><span style="color:var(--red);cursor:pointer;" onclick="BUI.removeCombo(' + item.realIndex + ')">✕ ' + (LANG==='en'?'Remove':'삭제') + '</span></div>';
  }).join('') || '<div style="font-size:11.5px;color:var(--text-faint);padding:8px 0;">' + (LANG==='en' ? 'No combos registered yet.' : '아직 등록된 조합이 없습니다.') + '</div>';
  var summaryLine = '<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:6px;">' + (LANG==='en' ? 'Ready to register: ' : '지금 등록 준비된 조합: ') + '<b style="color:var(--gold);">' + combos.length + ' / ' + cap + '</b>' +
    (lastAdded > 0 ? (LANG==='en' ? (' — ' + lastAdded + ' just added (marked NEW, shown at top)') : (' — 방금 ' + lastAdded + '개 추가됨 (맨 위 "신규" 표시)')) : '') + '</div>';
  el.innerHTML = summaryLine + listHtml;
  var btn = document.getElementById('submitMultiPicksBtn');
  if (btn) btn.disabled = combos.length === 0;
  var quickBtn = document.getElementById('quickSaveBtn');
  if (quickBtn) quickBtn.disabled = combos.length === 0;
  BUI.updateMyStatusPreview(); // 제출 전이라도 "내 베팅현황" 카드의 등록 조합 수를 실시간 반영
};

// 스테이징 중인 조합 개수를 "내 베팅현황" 카드에 즉시 반영(서버 재조회 없이 가볍게)
BUI.updateMyStatusPreview = async function(){
  var room = await BATTLE.getRoom(BUI.state.currentRoomId);
  if (!room) return;
  var myParticipant = room.participants.find(function(p){ return p.isMe; });
  BUI.renderMyStatusCard(room, myParticipant);
};

// ── 추첨 결과 (FFA 전용 — 예전 1:1/팀전 분기 삭제) ──
BUI.resultCardHtml = function(room){
  var r = room.result;
  var resultHtml = r ? ('<div class="card"><h3>' + (LANG==='en'?'Draw Result':'추첨 결과') + '</h3><div class="font-num" style="font-size:14px;">' + r.nums.join(', ') + ' <span style="color:var(--text-faint);">+ ' + r.bonus + '</span></div></div>') : '';

  var rankedHtml;
  if (room.allForfeited) {
    rankedHtml = '<div class="card" style="background:rgba(224,80,80,.08);border-color:#e05050;"><h3>⚠️ ' + (LANG==='en'?'Everyone forfeited':'전원 몰수패') + '</h3><div style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">' + (LANG==='en'
      ? 'No one submitted any combos before the deadline, so there is no winner. No refunds or payouts either.'
      : '등록 마감까지 아무도 번호조합을 제출하지 않아 우승자가 없습니다. 참가비 환불이나 보상 지급도 없습니다.') + '</div></div>';
  } else if (room.isDraw) {
    rankedHtml = '<div class="card" style="background:rgba(91,156,213,.08);border-color:var(--blue);"><h3>🤝 ' + (LANG==='en'?'Tie':'무승부') + '</h3><div style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">' + (LANG==='en'
        ? 'Multiple participants tied for 1st place (same total prize and win count). They split the payout proportionally by how many units they each bought.'
        : '여러 명이 공동 1위(당첨금 합계·당첨개수 동일)입니다. 각자 산 단위 비율로 배당을 나눠 받습니다.') + '</div></div>' +
      '<div class="card"><h3>' + (LANG==='en'?'Results':'결과') + '</h3>' + room.participants.map(function(p){
        var forfeitTag = p.forfeited ? (LANG==='en'?' (not submitted)':' (미제출)') : '';
        var statLine = LANG==='en' ? ('total ' + (p.totalPrize||0).toLocaleString() + 'P · ' + (p.comboCount||0) + ' combos') : ('누적 ' + (p.totalPrize||0).toLocaleString() + '원 · ' + (p.comboCount||0) + '개 조합');
        return '<div class="participant-row"><span>' + p.nickname + (p.isMe?(LANG==='en'?' (me)':' (나)'):'') + forfeitTag + '</span><span class="font-num">' + statLine + '</span></div>';
      }).join('') + '</div>';
  } else {
    var sortedResult = room.participants.slice().sort(function(a,b){ return (b.totalPrize||0) - (a.totalPrize||0); });
    rankedHtml = '<div class="card"><h3>🏆 ' + (LANG==='en'?'Results (by total prize)':'결과 (당첨금 합계 순)') + '</h3>' + sortedResult.map(function(p, i){
      var isWinner = room.winnerIds.indexOf(p.id) >= 0;
      var forfeitTag = p.forfeited ? (LANG==='en'?' (not submitted, forfeited)':' (미제출·몰수패)') : '';
      var rankTag = (i+1) + (LANG==='en' ? '. ' : '위 · ');
      var statLine = LANG==='en' ? ('total ' + (p.totalPrize||0).toLocaleString() + 'P · ' + (p.comboCount||0) + ' combos') : ('누적 ' + (p.totalPrize||0).toLocaleString() + '원 · ' + (p.comboCount||0) + '개 조합');
      return '<div class="participant-row' + (isWinner?' winner':'') + '"><span>' + rankTag + p.nickname + (p.isMe?(LANG==='en'?' (me)':' (나)'):'') + forfeitTag + (isWinner?' 🏆':'') + '</span><span class="font-num">' + statLine + '</span></div>';
    }).join('') + '</div>';
  }
  return resultHtml + rankedHtml;
};

BUI.myResultBadge = function(r){
  var mine = r.participants.find(function(p){ return p.isMe; });
  if (!mine) return '';
  if (r.allForfeited) return '<span class="result-badge draw">⚠️ ' + (LANG==='en'?'All forfeited':'전원몰수') + '</span>';
  if (r.isDraw) return '<span class="result-badge draw">🤝 ' + (LANG==='en'?'Tie':'무승부') + '</span>';
  if (mine.forfeited) return '<span class="result-badge lose">' + (LANG==='en'?'Lost (forfeited)':'패(몰수)') + '</span>';
  var won = r.winnerIds.indexOf(mine.id) >= 0;
  return won ? '<span class="result-badge win">🏆 ' + (LANG==='en'?'Won':'승리') + '</span>' : '<span class="result-badge lose">' + (LANG==='en'?'Lost':'패배') + '</span>';
};

// ── 이번 회차 전체 참가자 (구 "전체 배틀참여현황" — "방 이름" 컬럼 제거, 참가자 중심) ──
BUI.renderAllParticipants = function(room){
  var countEl = document.getElementById('allParticipantsCount');
  var body = document.getElementById('allParticipantsBody');
  countEl.textContent = room.participants.length.toLocaleString();
  if (!room.participants.length) {
    body.innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en'?'No participants yet — be the first!':'아직 참가자가 없습니다 — 첫 참가자가 되어보세요!') + '</div></div>';
    return;
  }
  var rowsHtml = room.participants.slice().sort(function(a,b){ return (b.unitsBought||0)-(a.unitsBought||0); }).map(function(p){
    var statusLabel = room.status === 'completed'
      ? BUI.myResultBadge({ participants:[p], allForfeited:room.allForfeited, isDraw:room.isDraw, winnerIds:room.winnerIds }) || (LANG==='en'?'Completed':'종료')
      : (p.submitted ? '<span class="status-tag status-active">' + (LANG==='en'?'Submitted':'제출완료') + '</span>' : '<span class="status-tag status-waiting">' + (LANG==='en'?'Registering':'등록중') + '</span>');
    return '<tr>' +
      '<td>' + p.nickname + (p.isMe?(LANG==='en'?' (me)':' (나)'):'') + '</td>' +
      '<td class="font-num">' + (p.unitsBought||0).toLocaleString() + '</td>' +
      '<td class="font-num">' + (p.comboCount||0).toLocaleString() + '</td>' +
      '<td>' + statusLabel + '</td>' +
    '</tr>';
  }).join('');
  body.innerHTML = '<div class="card" style="padding:0;overflow-x:auto;"><table class="all-rooms-table">' +
    '<thead><tr>' + (LANG==='en'
      ? '<th>Participant</th><th>Units</th><th>Combos</th><th>Status</th>'
      : '<th>참가자</th><th>구매단위</th><th>등록조합</th><th>상태</th>') + '</tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody></table></div>';
};

// ── 역대 내 참가 이력 (구 "내 진행상황" — 클릭하면 그 회차 상세를 이 페이지 상단에 불러옴) ──
BUI.renderMyHistory = async function(){
  var body = document.getElementById('myHistoryBody');
  var countEl = document.getElementById('myHistoryCount');
  var state = MLL.getAuthState();
  if (!state || !state.type) {
    countEl.textContent = '0';
    body.innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en' ? 'Log in to see every round you\'ve joined at a glance.' : '로그인하시면 참가했던 모든 회차를 한눈에 볼 수 있어요.') + '</div></div>';
    return;
  }
  try {
    var resp = await BATTLE._viewerFetch(MLL.API_BASE + '/api/battles/my-rooms');
    var data = await resp.json();
    // ⚠️ 1:1/팀전은 서비스 종료 — 예전 참가 이력이 남아있어도 화면엔 안 보이게 무제한 대결만 필터링.
    var rooms = (data.items || []).filter(function(r){ return r.type === 'ffa'; });
    countEl.textContent = rooms.length.toLocaleString();
    if (!rooms.length) { body.innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en' ? 'No battles joined yet — buy units above to get started!' : '아직 참가한 배틀이 없습니다. 위에서 단위를 구매해 시작해보세요!') + '</div></div>'; return; }
    body.innerHTML = '<div class="history-list">' + rooms.map(function(r){
      var badge = r.status === 'completed' ? BUI.myResultBadge(r) : '';
      var roundLabel = (LANG==='en' ? 'Round ' : '제') + r.round + (LANG==='en' ? '' : '회');
      var myP = r.participants.find(function(p){ return p.isMe; });
      var unitsLabel = myP ? ((LANG==='en'?'units ':'단위 ') + (myP.unitsBought||0) + (LANG==='en'?' · combos '+ (myP.comboCount||0) : ' · 조합 ' + (myP.comboCount||0) + '개')) : '';
      return '<div class="history-card" onclick="BUI.jumpToRound(\'' + r.id + '\')">' +
        '<div class="hc-top"><span class="status-tag status-' + r.status + '">' + (r.status==='completed'?(LANG==='en'?'Completed':'종료'):(r.status==='active'?(LANG==='en'?'Awaiting draw':'추첨대기'):(LANG==='en'?'Registering':'등록중'))) + '</span>' + badge + '</div>' +
        '<div class="hc-name">' + roundLabel + '</div>' +
        '<div class="hc-meta">' + unitsLabel + '</div>' +
      '</div>';
    }).join('') + '</div>';
  } catch(e) { body.innerHTML = '<div class="card"><div class="empty-state">' + (LANG==='en'?'Failed to load.':'불러오지 못했습니다.') + '</div></div>'; }
};

// 지난 회차(완료된 회차 포함) 클릭 시 상단 카드들을 그 회차 기준으로 다시 그림
BUI.jumpToRound = async function(roomId){
  BUI.state.currentRoomId = roomId;
  BUI.state.selectedBalls = [];
  BUI.state.multiCombos = [];
  BUI.state.lastAddedCount = 0;
  BUI.state.submitConfirmShown = false;
  BUI.state.submitRemaining = null;
  await BUI.renderCurrentRound();
  document.getElementById('myStatusCard').scrollIntoView({ behavior:'smooth', block:'start' });
};

document.addEventListener('DOMContentLoaded', BUI.init);

// =====================================================
// 다국어(i18n) / 테마 — main_page.html과 동일한 localStorage 키 공유
// =====================================================
var THEME = localStorage.getItem('mll_theme');
if (!THEME) { THEME = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
var LANG = localStorage.getItem('mll_lang') || 'kr';
function applyTheme(){
  document.body.classList.toggle('light-mode', THEME === 'light');
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = THEME === 'light' ? '☀️' : '🌙';
}
function toggleTheme(){ THEME = (THEME === 'light') ? 'dark' : 'light'; localStorage.setItem('mll_theme', THEME); applyTheme(); }
applyTheme();

function applyLang(){
  document.title = 'My Lotto Lab - Battles';
  document.querySelectorAll('[data-i18n-kr]').forEach(function(el){
    var text = (LANG === 'en') ? el.dataset.i18nEn : el.dataset.i18nKr;
    if (text !== undefined) el.textContent = text;
  });
  var krBtn = document.getElementById('langKrBtn'), enBtn = document.getElementById('langEnBtn');
  if (krBtn) { krBtn.style.background = LANG==='kr' ? 'var(--gold)' : 'var(--surface)'; krBtn.style.color = LANG==='kr' ? '#1a1305' : 'var(--text-dim)'; }
  if (enBtn) { enBtn.style.background = LANG==='en' ? 'var(--gold)' : 'var(--surface)'; enBtn.style.color = LANG==='en' ? '#1a1305' : 'var(--text-dim)'; }
}
function setLang(lang){
  LANG = lang;
  localStorage.setItem('mll_lang', lang);
  applyLang();
  if (typeof BUI !== 'undefined' && BUI.loadAndRenderAll) BUI.loadAndRenderAll();
}
document.addEventListener('DOMContentLoaded', applyLang);
</script>
