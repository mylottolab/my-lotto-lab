<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Lotto Lab - 회원 라운지</title>
<script src="https://my-lotto-lab-api.onrender.com/pay/auth_gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0a0d18;--surface:#11152a;--surface-2:#161b35;--border-soft:#1b2038;--border:#252b48;--text:#eef0f6;--text-dim:#8b91ab;--text-faint:#5a6080;--gold:#e0b341;--gold-dim:#8a6f2f;--accent:#5b6ee8;--green:#3fb37f;--bg-top:#0d1120;}
body.light-mode{--bg:#dbe0ee;--surface:#ffffff;--surface-2:#eef1f9;--border-soft:#d2d7e8;--border:#c2c8dd;--text:#161b30;--text-dim:#4c5372;--text-faint:#7a80a0;--gold:#a8781f;--gold-dim:#8a6f2f;--accent:#4453c9;--green:#178072;--bg-top:#e7eaf5;}
body{background:var(--bg);background-image:linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 340px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;font-size:14px;min-height:100vh;}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;flex-shrink:0;}
.theme-toggle:hover{border-color:var(--gold);}
.lang-toggle{display:flex;gap:4px;}
.lang-toggle button{border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:11px;font-weight:700;padding:6px 10px;}
a{color:inherit;text-decoration:none;}

.topbar{border-bottom:1px solid var(--border-soft);}
.topbar-inner{max-width:900px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #f3d785, var(--gold) 60%, var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:15px;}
.brand-name{font-size:14.5px;font-weight:700;}
.back-link{font-size:12.5px;color:var(--text-dim);}
.back-link:hover{color:var(--text);}

.wrap{max-width:900px;margin:0 auto;padding:32px 24px 60px;}

.board-links-row{display:flex;gap:12px;margin-top:8px;}
.board-link-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg, var(--surface-2), var(--surface));border:1px solid var(--border-soft);border-radius:14px;padding:16px 12px;cursor:pointer;transition:border-color .15s,transform .1s;}
.board-link-btn:hover{border-color:var(--gold-dim);transform:translateY(-1px);}
.board-link-btn .blb-icon{font-size:18px;}
.board-link-btn .blb-text{font-size:12.5px;font-weight:700;color:var(--text);}
@media (max-width:480px){
  .board-links-row{gap:8px;}
  .board-link-btn{padding:13px 8px;flex-direction:column;gap:5px;}
  .board-link-btn .blb-text{font-size:11px;text-align:center;}
}

.profile-card{background:linear-gradient(135deg, var(--surface-2), var(--surface));border:1px solid var(--border-soft);border-radius:20px;padding:32px;margin-bottom:24px;}
.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
.avatar{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #f3d785, var(--gold) 60%, var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.profile-name{font-size:19px;font-weight:700;}
.profile-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(224,179,65,.14);color:var(--gold);margin-top:5px;}

.balance-hero{text-align:center;padding:20px 0 26px;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
.balance-label{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
.balance-value{font-size:44px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
.balance-value .unit{font-size:20px;font-weight:600;margin-left:4px;}

.balance-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
.split-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:18px 20px;}
.split-box .slabel{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.split-box .sdot{width:8px;height:8px;border-radius:50%;}
.split-box.deposit .sdot{background:var(--accent);}
.split-box.activity .sdot{background:var(--green);}
.split-box .sval{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
.split-box .ssub{font-size:11px;color:var(--text-faint);margin-top:6px;}

.expiry-note{margin-top:16px;background:rgba(224,179,65,.08);border:1px solid rgba(224,179,65,.2);border-radius:10px;padding:12px 16px;font-size:12px;color:var(--text-dim);}
.expiry-note b{color:var(--gold);}

.action-row{display:flex;gap:10px;margin-top:22px;}
.action-btn{flex:1;text-align:center;padding:13px;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;}
.action-btn.primary{background:var(--gold);color:#1a1305;}
.action-btn.secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text);}

.lots-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;}
.lots-card h3{font-size:14.5px;font-weight:700;margin-bottom:14px;}
.lot-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.lot-row:last-child{border-bottom:none;}
.lot-row .ltype{display:flex;align-items:center;gap:8px;}
.lot-row .ldot{width:7px;height:7px;border-radius:50%;}
.lot-row.deposit .ldot{background:var(--accent);}
.lot-row.activity .ldot{background:var(--green);}
.lot-row .lpoints{font-weight:700;}
.lot-row .lexpiry{color:var(--text-faint);font-size:11px;}
.empty{text-align:center;padding:30px;color:var(--text-faint);font-size:12.5px;}

.loading{text-align:center;padding:60px 20px;color:var(--text-faint);}

@media (max-width:520px){
  .topbar-inner{height:auto;min-height:52px;padding:10px 16px;}
  .brand-mark{width:26px;height:26px;font-size:13px;}
  .brand-name{font-size:12.5px;}

  .wrap{padding:18px 14px 40px;}
  .profile-card{padding:20px;}
  .profile-top{gap:12px;margin-bottom:18px;}
  .avatar{width:46px;height:46px;font-size:19px;}
  .profile-name{font-size:16px;}

  .balance-hero{padding:14px 0 18px;}
  .balance-value{font-size:32px;}
  .balance-value .unit{font-size:15px;}

  .balance-split{grid-template-columns:1fr;gap:10px;}
  .split-box{padding:14px 16px;}

  .action-row{flex-direction:column;}

  .lots-card{padding:16px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="location.href='main_page.html'">
      <div class="brand-mark">🏠</div>
      <div class="brand-name">My Lotto Lab</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="lang-toggle">
        <button type="button" id="langKrBtn" onclick="setLang('kr')">KR</button>
        <button type="button" id="langEnBtn" onclick="setLang('en')">EN</button>
      </div>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="야간/주간 모드 전환">🌙</button>
      <a class="back-link" id="backLink" href="main_page.html" data-i18n-kr="← 메인으로" data-i18n-en="← Main">← 메인으로</a>
    </div>
  </div>
</div>

<div class="wrap" style="padding-bottom:0;">
  <div class="board-links-row">
    <div class="board-link-btn" onclick="openBoard('howto')">
      <span class="blb-icon">📖</span>
      <span class="blb-text" data-i18n-kr="본 사이트 이용법" data-i18n-en="How to Use This Site">본 사이트 이용법</span>
    </div>
    <div class="board-link-btn" onclick="openBoard('notice')">
      <span class="blb-icon">📢</span>
      <span class="blb-text" data-i18n-kr="공지 및 안내사항" data-i18n-en="Notices & Announcements">공지 및 안내사항</span>
    </div>
  </div>
</div>

<div class="wrap" id="content">
  <div class="loading" data-i18n-kr="불러오는 중..." data-i18n-en="Loading...">불러오는 중...</div>
</div>

<script>
var THEME = localStorage.getItem('mll_theme');
if (!THEME) { THEME = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
function applyTheme(){
  document.body.classList.toggle('light-mode', THEME === 'light');
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = THEME === 'light' ? '☀️' : '🌙';
}
function toggleTheme(){ THEME = (THEME === 'light') ? 'dark' : 'light'; localStorage.setItem('mll_theme', THEME); applyTheme(); }
applyTheme();

var LANG = localStorage.getItem('mll_lang') || 'kr';
function applyLang(){
  document.querySelectorAll('[data-i18n-kr]').forEach(function(el){
    var v = (LANG === 'en') ? el.dataset.i18nEn : el.dataset.i18nKr;
    if (v !== undefined) el.textContent = v;
  });
  var krBtn = document.getElementById('langKrBtn'), enBtn = document.getElementById('langEnBtn');
  if (krBtn) { krBtn.style.background = LANG==='kr' ? 'var(--gold)' : 'var(--surface)'; krBtn.style.color = LANG==='kr' ? '#1a1305' : 'var(--text-dim)'; }
  if (enBtn) { enBtn.style.background = LANG==='en' ? 'var(--gold)' : 'var(--surface)'; enBtn.style.color = LANG==='en' ? '#1a1305' : 'var(--text-dim)'; }
  load(); // 잔액/포인트 내역 등 동적으로 그려지는 부분도 언어에 맞게 다시 그린다
}
function setLang(lang){ LANG = lang; localStorage.setItem('mll_lang', lang); applyLang(); }
</script>

<script>
function openBoard(boardKey){
  window.open('board_view.html?board=' + boardKey, 'mllBoard_' + boardKey, 'width=480,height=720,scrollbars=yes,resizable=yes');
}
</script>

<script>
var API = 'https://my-lotto-lab-api.onrender.com';

// ⚠ 2026-07-13: 예전엔 여기서 localStorage 토큰을 날것 그대로 읽었는데, 그러면
// 토큰이 만료된 뒤에도 감지를 못 해서 화면에 "undefined님 / 0P"가 조용히 떠버리는
// 버그가 있었다. mocktest_hub.html이 이미 쓰고 있는 것과 동일하게, 요청 전에
// MLL.ensureFreshToken()으로 먼저 토큰을 최신 상태로 갱신한 뒤 상태를 가져온다.
async function getAuthState() {
  if (window.MLL && MLL.ensureFreshToken) { try { await MLL.ensureFreshToken(); } catch (e) {} }
  if (window.MLL && MLL.getAuthState) return MLL.getAuthState();

  // MLL이 아직 로드되지 않은 극히 드문 경우를 위한 안전장치 (기존 방식 그대로)
  var token = localStorage.getItem('mll_token') || sessionStorage.getItem('mll_token');
  if (token) return { type: 'member', token: token };
  var gNick = localStorage.getItem('mll_guest_nickname');
  var gEmail = localStorage.getItem('mll_guest_email');
  if (gNick && gEmail) return { type: 'guest', nickname: gNick, email: gEmail };
  return { type: null };
}

// 다른 도메인(my-lotto-lab-api.onrender.com)으로 이동하는 링크에 인증정보를 실어 보낸다.
// (localStorage는 도메인별로 분리 저장되므로, 그냥 링크만 걸면 도착 페이지에서 로그인이 풀려보임)
function withAuthParams(url, state) {
  if (!state.type) return url;
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  if (state.type === 'member') return url + sep + 'mll_auth=member&mll_tok=' + encodeURIComponent(state.token);
  return url + sep + 'mll_auth=guest&mll_nick=' + encodeURIComponent(state.nickname) + '&mll_em=' + encodeURIComponent(state.email);
}

// ── 동적으로 그려지는(load() 내부) 문구용 사전 ──
var I18N = {
  loginRequired:  { kr: '로그인이 필요합니다', en: 'Login required' },
  loginSignup:    { kr: '로그인 / 회원가입', en: 'Log in / Sign up' },
  guestRegister:  { kr: '비회원 등록 / 로그인', en: 'Guest registration / Login' },
  sessionExpired: { kr: '로그인 세션이 만료되었습니다. 다시 로그인해주세요.', en: 'Your session has expired. Please log in again.' },
  reLogin:        { kr: '다시 로그인', en: 'Log in again' },
  toMain:         { kr: '메인으로', en: 'To main' },
  totalBalance:   { kr: '총 포인트 잔액', en: 'Total point balance' },
  depositPoints:  { kr: '입금포인트', en: 'Deposit points' },
  depositSub:     { kr: '카드·페이팔·무통장입금으로 충전', en: 'Charged via card, PayPal, or bank transfer' },
  activityPoints: { kr: '활동포인트', en: 'Activity points' },
  activitySub:    { kr: '활동·보상으로 적립, 차감시 우선 사용', en: 'Earned via activity/rewards, used first when spending' },
  nearestExpiry:  { kr: '가장 빠른 소멸 예정', en: 'Next to expire' },
  guestExpiryNote:{ kr: '비회원 포인트는 취득일로부터 30일 후 소멸됩니다.', en: 'Guest points expire 30 days after being earned.' },
  memberNoExpiry: { kr: '회원 포인트는 소멸되지 않습니다.', en: 'Member points never expire.' },
  chargePoints:   { kr: '포인트 충전하러 가기', en: 'Charge points' },
  logout:         { kr: '🚪 로그아웃', en: '🚪 Log out' },
  logoutConfirm:  { kr: '로그아웃 하시겠습니까?', en: 'Log out?' },
  pointDetail:    { kr: '포인트 상세 내역', en: 'Point details' },
  noPointHistory: { kr: '적립된 포인트 내역이 없습니다.', en: 'No point history yet.' },
  noExpiry:       { kr: '소멸 없음', en: 'Never expires' },
  expiresOn:      { kr: '소멸', en: 'expires' },
  member:         { kr: '회원', en: 'Member' },
  guest:          { kr: '비회원', en: 'Guest' },
  nicknameSuffix: { kr: '님', en: '' }
};
function t(key){ return I18N[key][LANG]; }

async function load() {
  var state = await getAuthState();
  var content = document.getElementById('content');

  if (!state.type) {
    content.innerHTML =
      '<div class="profile-card" style="text-align:center;">' +
        '<div class="balance-label">' + t('loginRequired') + '</div>' +
        '<div class="action-row">' +
          '<a class="action-btn primary" href="login.html">' + t('loginSignup') + '</a>' +
          '<a class="action-btn secondary" href="' + API + '/pay/guest_test.html">' + t('guestRegister') + '</a>' +
        '</div>' +
      '</div>';
    return;
  }

  var nickname = state.nickname;
  var isGuest = state.type === 'guest';
  var headers = {};
  var qs = '';
  var sessionExpired = false;
  if (state.type === 'member') {
    headers['Authorization'] = 'Bearer ' + state.token;
    try {
      var meRes = await fetch(API + '/api/auth/me', { headers: headers });
      if (meRes.status === 401) sessionExpired = true;
      var me = await meRes.json();
      if (meRes.ok) nickname = me.nickname;
    } catch (e) {}
  } else {
    qs = '?nickname=' + encodeURIComponent(state.nickname) + '&email=' + encodeURIComponent(state.email);
  }

  // ⚠ MLL.ensureFreshToken()으로 갱신을 시도했는데도 /api/auth/me가 401이면, 세션이
  // 완전히 끊긴 것이다. 이 경우 예전처럼 "undefined님 / 0P"를 그냥 보여주는 대신,
  // 명확하게 재로그인을 안내한다 (조용히 실패를 삼키지 않는다).
  // ⚠ MLL.logout()은 호출 즉시 main_page.html로 강제 이동시켜버려서 이 안내 메시지가
  // 뜰 새도 없이 화면이 넘어가버린다. 그래서 여기선 logout()을 부르지 않고, 만료된
  // 토큰만 직접 지워서(재사용 방지) 이 페이지에 안내 메시지가 그대로 보이게 한다.
  if (sessionExpired) {
    localStorage.removeItem('mll_token'); sessionStorage.removeItem('mll_token');
    localStorage.removeItem('mll_refresh_token'); sessionStorage.removeItem('mll_refresh_token');
    localStorage.removeItem('mll_user'); sessionStorage.removeItem('mll_user');
    content.innerHTML =
      '<div class="profile-card" style="text-align:center;">' +
        '<div class="balance-label">' + t('sessionExpired') + '</div>' +
        '<div class="action-row">' +
          '<a class="action-btn primary" href="login.html">' + t('reLogin') + '</a>' +
          '<a class="action-btn secondary" href="main_page.html">' + t('toMain') + '</a>' +
        '</div>' +
      '</div>';
    return;
  }

  var balance = { total: 0, deposit: 0, activity: 0 };
  var lots = [];
  try {
    var lotsRes = await fetch(API + '/api/points/lots' + qs, { headers: headers });
    var lotsData = await lotsRes.json();
    if (lotsRes.ok) {
      balance = { total: lotsData.total, deposit: lotsData.deposit, activity: lotsData.activity };
      lots = (lotsData.lots || []).map(function(l){ return { type: l.type, points: l.points, expiresAt: l.expiresAt }; });
    }
  } catch (e) {}

  // ⚠ 회원 포인트는 소멸되지 않는다(설계 확정, 2026-07-04). 서버는 이를
  // '2099-12-31' 같은 먼 미래 날짜로 표현하므로, 화면에서는 그 날짜를
  // "소멸 없음"으로 바꿔서 보여준다. 실제로 곧 소멸되는(비회원) 포인트만
  // "가장 빠른 소멸 예정" 계산에 포함시킨다.
  var NEVER_EXPIRES_YEAR = 2099;
  function isPermanent(expiresAt){ return new Date(expiresAt).getFullYear() >= NEVER_EXPIRES_YEAR; }

  // ⚠ 회원은 정책상 포인트가 소멸되지 않으므로, 혹시 예전(정책 적용 전) 데이터가
  //   30일 만료값을 그대로 갖고 있더라도 회원에게는 절대 소멸 안내를 보여주지 않는다.
  //   (데이터 정합성은 별도 SQL로 맞추더라도, 화면 표시는 정책을 우선 신뢰한다)
  var expiringLots = isGuest ? lots.filter(function(l){ return !isPermanent(l.expiresAt); }) : [];
  var nearestExpiry = expiringLots.length
    ? expiringLots.slice().sort(function(a,b){ return new Date(a.expiresAt) - new Date(b.expiresAt); })[0]
    : null;

  var lotsHtml = lots.length
    ? lots.map(function(l){
        var cls = l.type === 'deposit' ? 'deposit' : 'activity';
        var label = l.type === 'deposit' ? t('depositPoints') : t('activityPoints');
        var expiryLabel = (!isGuest || isPermanent(l.expiresAt)) ? t('noExpiry') : (new Date(l.expiresAt).toLocaleDateString(LANG === 'en' ? 'en-US' : 'ko-KR') + ' ' + t('expiresOn'));
        return '<div class="lot-row ' + cls + '"><span class="ltype"><span class="ldot"></span>' + label + '</span><span class="lpoints">' + l.points.toLocaleString() + 'P</span><span class="lexpiry">' + expiryLabel + '</span></div>';
      }).join('')
    : '<div class="empty">' + t('noPointHistory') + '</div>';

  content.innerHTML =
    '<div class="profile-card">' +
      '<div class="profile-top">' +
        '<div class="avatar">' + (isGuest ? '🕶️' : '👤') + '</div>' +
        '<div>' +
          '<div class="profile-name">' + nickname + t('nicknameSuffix') + '</div>' +
          '<div class="profile-badge">' + (isGuest ? t('guest') : t('member')) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="balance-hero">' +
        '<div class="balance-label">' + t('totalBalance') + '</div>' +
        '<div class="balance-value">' + balance.total.toLocaleString() + '<span class="unit">P</span></div>' +
      '</div>' +
      '<div class="balance-split">' +
        '<div class="split-box deposit"><div class="slabel"><span class="sdot"></span>' + t('depositPoints') + '</div><div class="sval">' + balance.deposit.toLocaleString() + 'P</div><div class="ssub">' + t('depositSub') + '</div></div>' +
        '<div class="split-box activity"><div class="slabel"><span class="sdot"></span>' + t('activityPoints') + '</div><div class="sval">' + balance.activity.toLocaleString() + 'P</div><div class="ssub">' + t('activitySub') + '</div></div>' +
      '</div>' +
      (nearestExpiry
        ? '<div class="expiry-note">' + t('nearestExpiry') + ': <b>' + new Date(nearestExpiry.expiresAt).toLocaleDateString(LANG === 'en' ? 'en-US' : 'ko-KR') + '</b> (' + nearestExpiry.points.toLocaleString() + 'P) — ' + t('guestExpiryNote') + '</div>'
        : (isGuest
            ? '<div class="expiry-note">' + t('guestExpiryNote') + '</div>'
            : '<div class="expiry-note">' + t('memberNoExpiry') + '</div>'
          )
      ) +
      '<div class="action-row">' +
        '<a class="action-btn primary" href="' + withAuthParams(API + '/pay/category_select.html', state) + '">' + t('chargePoints') + '</a>' +
        '<a class="action-btn secondary" href="main_page.html">' + t('toMain') + '</a>' +
      '</div>' +
      '<div style="margin-top:10px;text-align:center;">' +
        '<span onclick="if(confirm(' + JSON.stringify(t('logoutConfirm')) + '))MLL.logout();" style="font-size:11.5px;color:var(--text-faint);cursor:pointer;text-decoration:underline;">' + t('logout') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="lots-card">' +
      '<h3>' + t('pointDetail') + '</h3>' +
      lotsHtml +
    '</div>';
}

applyLang();
</script>
</body>
</html>
