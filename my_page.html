<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page - My Lotto Lab</title>
<script src="https://my-lotto-lab-api.onrender.com/pay/common.js?v=20260814a"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d18; --surface:#11152a; --surface-2:#161b35;
  --border:#252b48; --border-soft:#1b2038;
  --text:#eef0f6; --text-dim:#8b91ab; --text-faint:#5a6080;
  --gold:#e0b341; --gold-dim:#8a6f2f;
  --green:#3fb37f; --red:#e05c5c;
  --card-shadow:0 1px 2px rgba(0,0,0,.2);
  --bg-top:#0d1120;
}
body.light-mode{
  --bg:#dbe0ee; --surface:#ffffff; --surface-2:#eef1f9;
  --border:#c2c8dd; --border-soft:#d2d7e8;
  --text:#161b30; --text-dim:#4c5372; --text-faint:#7a80a0;
  --gold:#a8781f; --gold-dim:#8a6f2f;
  --green:#178072; --red:#c0392b;
  --card-shadow:0 1px 2px rgba(30,36,66,.06);
  --bg-top:#e7eaf5;
}
body{background:var(--bg);background-image:linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 340px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;font-size:14px;letter-spacing:-0.01em;min-height:100vh;}
a{color:inherit;text-decoration:none;}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border-soft);background:rgba(10,13,24,0.85);backdrop-filter:blur(6px);flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #f3d785, var(--gold) 60%, var(--gold-dim));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:17px;height:17px;stroke:#1a1404;stroke-width:1.8;fill:none;}
.brand-text .t1{font-size:14px;font-weight:700;}
.brand-text .t2{font-size:10.5px;color:var(--text-faint);}
.hdr-right{display:flex;align-items:center;gap:10px;}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.lang-toggle button{border:none;background:var(--surface);color:var(--text-dim);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-toggle button.active{background:var(--gold);color:#1a1305;}
.lounge-mini-btn{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:11.5px;cursor:pointer;border:1px solid var(--border);padding:6px 12px;border-radius:7px;background:none;font-family:inherit;transition:border-color .15s,color .15s;}
.lounge-mini-btn:hover{border-color:var(--gold);color:var(--gold);}

main{max-width:960px;margin:0 auto;padding:28px 20px 90px;}
.page-title{font-size:23px;font-weight:600;margin-bottom:4px;}
.page-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:24px;}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:var(--card-shadow);}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.soon-badge{font-size:10px;font-weight:700;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;margin-left:auto;}

.login-notice{text-align:center;padding:60px 20px;}
.login-notice p{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.login-notice a{display:inline-block;background:var(--gold);color:#1a1305;font-weight:700;padding:10px 22px;border-radius:9px;font-size:13px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px;}
.stat-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;}
.stat-box .num{font-size:21px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;}
.stat-box .lbl{font-size:10.5px;color:var(--text-faint);margin-top:4px;font-weight:600;}

.win-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:9px;margin-bottom:7px;flex-wrap:wrap;}
.win-row .wr-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.win-round{font-size:11px;color:var(--text-faint);font-weight:600;min-width:56px;}
.win-grade{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.win-prize{font-size:12.5px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;}

.recent-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12px;flex-wrap:wrap;}
.recent-row:last-child{border-bottom:none;}
.recent-round{color:var(--text-faint);font-size:10.5px;min-width:52px;}

.empty-state{text-align:center;color:var(--text-faint);font-size:12.5px;padding:24px 0;}

.soon-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.soon-card{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--text-faint);font-size:12px;}
.soon-card .ic{font-size:20px;margin-bottom:6px;}

@media (max-width:640px){
  header{padding:12px 16px;}
  main{padding:18px 14px 80px;}
  .page-title{font-size:19px;}
}
</style>
</head>
<body>

  <div class="brand" onclick="location.href='main_page.html'">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l3 3-3 3M15 9l-3 3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    pointsTitle:'🪙 포인트 현황', statBalance:'총 잔액', statDeposit:'입금포인트', statActivity:'활동포인트',

    fetchError:'Failed to load.',

    summaryTitle:'📋 My Entries Summary', statTotal:'Total Entries', statReal:'Real Purchase', statVirtual:'Virtual',
    statWinCount:'Wins', statTotalPrize:'Total Prize',
    winsTitle:'🏆 Winning History', noWins:'No winnings yet.',

    noMocktest:'No tests taken yet.', goMocktest:'Go to Mock Test →',

    noPurchases:'No purchases yet.', goShop:'Go to Shop →', pages:'pages', games:'games', product:'Product',

    pointsTitle:'🪙 Points Overview', statBalance:'Total Balance', statDeposit:'Deposit Points', statActivity:'Activity Points',

};
function t(key){ return T[LANG][key]; }

function applyStaticLang(){
  document.getElementById('langKrBtn').classList.toggle('active', LANG==='kr');
  document.getElementById('langEnBtn').classList.toggle('active', LANG==='en');
  document.getElementById('loungeLabel').textContent = t('loungeLabel');
  document.getElementById('brandSubTxt').textContent = t('brandSub');
  document.getElementById('pageTitleTxt').textContent = t('pageTitle');
  document.getElementById('pageSubTxt').textContent = t('pageSub');
  document.getElementById('loadingTxt').textContent = t('loading');
}
function setLang(lang){
  LANG = lang;
  localStorage.setItem('mll_lang', lang);
  applyStaticLang();
  init(); // 카드 내용도 전부 다시 그림(데이터는 캐시돼있어 재요청 비용은 적음)
}
applyStaticLang();

// =====================================================
// 공용 인증 헤더/쿼리 헬퍼
// =====================================================
async function mllAuthHeaders(){
  var state = MLL.getAuthState();
  var h = {};
  if (state.type === 'member') {
    var fresh = await MLL.ensureFreshToken();
    if (fresh && fresh !== 'guest') h['Authorization'] = 'Bearer ' + fresh;
  }
  return h;
}
function mllAuthQuery(extra){
  var state = MLL.getAuthState();
  var parts = extra ? extra.slice() : [];
  if (state.type === 'guest') {
    parts.push('nickname=' + encodeURIComponent(state.nickname));
    parts.push('email=' + encodeURIComponent(state.email));
  }
  return parts.length ? ('?' + parts.join('&')) : '';
}
var SOON_ITEMS = []; // 8개 카테고리 전부 연결 완료 — 남은 준비중 항목 없음

// ⚠ 2026-08-15 추가: 언어 전환 시 서버를 다시 호출하지 않고, 최초 1회 받아온 데이터를
// 그대로 재사용해서 다시 그리기만 한다 — 언어 버튼을 눌러도 반영이 안 되던 문제의
// 원인이었을 수 있는 비동기 재요청 자체를 없애서, 전환이 항상 즉시·확실하게 되도록 함.
var CACHE = {};

// =====================================================
// 초기화
// =====================================================
async function init(){
  var state = MLL.getAuthState();
  var body = document.getElementById('body');

  if (!state.type) {
    body.innerHTML = '<div class="card"><div class="login-notice">' +
      '<p>' + t('loginNoticeP') + '</p>' +
      '<a href="hub_lounge.html">' + t('loginLink') + '</a>' +
    '</div></div>';
    return;
  }

  body.innerHTML = '<div class="empty-state">' + t('loading') + '</div>';

  await Promise.all([MLL.refreshEntries(), MLL.refreshResults()]);
  var entries = MLL.loadEntries();

  renderSummary(entries);
  renderWins(entries);
  renderRecent(entries);
  await renderSeoulRace();
  await renderBattles();
  await renderMockSim();
  await renderMocktest();
  await renderShop();
  await renderGlobalLotto();
  await renderPointsHistory();
  renderSoon();
}

// ── 📋 등록한 번호조합 요약 ──
function renderSummary(entries){
  var total = entries.length;
  var real = entries.filter(function(e){ return e.isReal; }).length;
  var virtual = total - real;
  var drawn = entries.filter(function(e){ return e.status !== '추첨전'; });
  var wins = drawn.filter(function(e){ return e.grade && e.grade > 0; });
  var totalPrize = wins.reduce(function(s,e){ return s + (e.prizeMoney||0); }, 0);
  var wonUnit = LANG==='en' ? '' : '원';

  var html = '<div class="card"><h2>' + t('summaryTitle') + '</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + total.toLocaleString() + '</div><div class="lbl">' + t('statTotal') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + real.toLocaleString() + '</div><div class="lbl">' + t('statReal') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + virtual.toLocaleString() + '</div><div class="lbl">' + t('statVirtual') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + wins.length.toLocaleString() + '</div><div class="lbl">' + t('statWinCount') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + (LANG==='en'?'₩':'') + totalPrize.toLocaleString() + wonUnit + '</div><div class="lbl">' + t('statTotalPrize') + '</div></div>' +
    '</div></div>';
  document.getElementById('body').innerHTML = html;
}

// ── 🏆 당첨 이력 ──
function renderWins(entries){
  var drawn = entries.filter(function(e){ return e.status !== '추첨전' && e.grade && e.grade > 0; });
  drawn.sort(function(a,b){ return b.round - a.round; });
  var wonUnit = LANG==='en' ? '' : '원';
  var wonPrefix = LANG==='en' ? '₩' : '';

  var rows = drawn.length
    ? drawn.map(function(e){
        var nums = e.nums.slice().sort(function(a,b){return a-b;});
        var ballsHtml = MLL.renderBalls(nums, [], true);
        var gradeLabel = t('gradeLabels')[e.grade];
        return '<div class="win-row">' +
          '<div class="wr-left">' +
            '<span class="win-round">' + t('round')(e.round) + '</span>' +
            ballsHtml +
            '<span class="win-grade" style="color:' + MLL.GRADE_COLOR[e.grade] + ';background:' + MLL.GRADE_COLOR[e.grade] + '22;">' + gradeLabel + '</span>' +
          '</div>' +
          '<span class="win-prize">' + wonPrefix + (e.prizeMoney||0).toLocaleString() + wonUnit + '</span>' +
        '</div>';
      }).join('')
    : '<div class="empty-state">' + t('noWins') + '</div>';

  document.getElementById('body').innerHTML += '<div class="card"><h2>' + t('winsTitle') + '</h2>' + rows + '</div>';
}

// ── 🕓 최근 등록한 번호조합 ──
function renderRecent(entries){
  var sorted = MLL.sortEntries(entries).slice(0, 10);
  var rows = sorted.length
    ? sorted.map(function(e){
        var nums = e.nums.slice().sort(function(a,b){return a-b;});
        var ballsHtml = MLL.renderBalls(nums, [], true);
        var statusTxt = e.status==='추첨전' ? '<span style="color:var(--red);font-weight:700;">' + t('preDraw') + '</span>' : '<span style="color:var(--text-faint);">' + t('postDraw') + '</span>';
        return '<div class="recent-row">' +
          '<span class="recent-round">' + t('round')(e.round) + '</span>' +
          ballsHtml +
          '<span>' + statusTxt + '</span>' +
        '</div>';
      }).join('')
    : '<div class="empty-state">' + t('noEntries') + '</div>';

  document.getElementById('body').innerHTML += '<div class="card"><h2>' + t('recentTitle') + '</h2>' + rows +
    '<div style="text-align:center;margin-top:12px;"><a href="lotto_input_page_v4.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('viewAll') + '</a></div>' +
  '</div>';
}

// ── 🐎 서울경마장 (대상경마·상시경마) ──
async function renderSeoulRace(){
  var html = '<div class="card"><h2>' + t('seoulTitle') + '</h2>';
  try {
    var data = CACHE.seoulRace;
    if (!data) {
      var resp = await fetch(MLL.API_BASE + '/api/seoul-race/my-bets' + mllAuthQuery(), { headers: await mllAuthHeaders() });
      data = await resp.json();
      CACHE.seoulRace = data;
    }
    var items = data.items || [];
    var settled = items.filter(function(b){ return b.status === 'settled'; });
    var totalPayout = settled.reduce(function(s,b){ return s + (b.payout||0); }, 0);
    var wonCount = settled.filter(function(b){ return b.payout > 0; }).length;

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + items.length.toLocaleString() + '</div><div class="lbl">' + t('statBetCount') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + wonCount.toLocaleString() + '</div><div class="lbl">' + t('statPayoutCount') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + totalPayout.toLocaleString() + 'P</div><div class="lbl">' + t('statTotalPayout') + '</div></div>' +
    '</div>';

    if (items.length) {
      var recent = items.slice(0, 5);
      var locale = LANG==='en' ? 'en-US' : 'ko-KR';
      html += recent.map(function(b){
        var statusHtml = b.status === 'settled'
          ? (b.payout > 0 ? '<span style="color:var(--green);font-weight:700;">+' + b.payout.toLocaleString() + 'P</span>' : '<span style="color:var(--text-faint);">' + t('lose') + '</span>')
          : '<span style="color:var(--gold);">' + t('settled') + '</span>';
        return '<div class="recent-row"><span>' + t('horseUnits')(b.horse_no, b.units||0) + '</span>' +
          '<span style="color:var(--text-faint);font-size:10.5px;">' + new Date(b.placed_at).toLocaleDateString(locale) + '</span>' +
          '<span>' + statusHtml + '</span></div>';
      }).join('');
    } else {
      html += '<div class="empty-state">' + t('noBets') + '</div>';
    }
    html += '<div style="text-align:center;margin-top:12px;"><a href="hub_seoul_race.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('goRace') + '</a></div>';
  } catch(e) {
    console.error('[my_page] seoul-race error', e);
    html += '<div class="empty-state">' + t('fetchError') + '</div>';
  }
  html += '</div>';
  document.getElementById('body').innerHTML += html;
}

// ── ⚔️ 무제한 대결(Battles) ──
async function renderBattles(){
  var html = '<div class="card"><h2>' + t('battlesTitle') + '</h2>';
  try {
    var data = CACHE.battles;
    if (!data) {
      var state = MLL.getAuthState();
      var headers = await mllAuthHeaders();
      var url = MLL.API_BASE + '/api/battles/my-rooms';
      if (state.type === 'guest') url += mllAuthQuery();
      var resp = await fetch(url, { headers: headers });
      data = await resp.json();
      CACHE.battles = data;
    }
    var rooms = (data.items || []).filter(function(r){ return r.type === 'ffa'; });
    var wonCount = rooms.filter(function(r){
      if (r.status !== 'completed') return false;
      var me = r.participants.find(function(p){ return p.isMe; });
      return me && r.winnerIds && r.winnerIds.indexOf(me.id) >= 0;
    }).length;

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + rooms.length.toLocaleString() + '</div><div class="lbl">' + t('statJoinedRounds') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + wonCount.toLocaleString() + '</div><div class="lbl">' + t('statWinRounds') + '</div></div>' +
    '</div>';

    if (rooms.length) {
      var recent = rooms.slice(0, 5);
      html += recent.map(function(r){
        var me = r.participants.find(function(p){ return p.isMe; });
        var statusTxt = r.status==='completed' ? '<span style="color:var(--text-faint);">' + t('ended') + '</span>' : '<span style="color:var(--gold);">' + t('inProgress') + '</span>';
        return '<div class="recent-row"><span>' + t('round')(r.round) + '</span>' +
          '<span style="color:var(--text-faint);font-size:10.5px;">' + (me ? t('unitsCombo')(me.unitsBought||0, me.comboCount||0) : '') + '</span>' +
          '<span>' + statusTxt + '</span></div>';
      }).join('');
    } else {
      html += '<div class="empty-state">' + t('noBattles') + '</div>';
    }
    html += '<div style="text-align:center;margin-top:12px;"><a href="hub_battles.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('goBattles') + '</a></div>';
  } catch(e) {
    console.error('[my_page] battles error', e);
    html += '<div class="empty-state">' + t('fetchError') + '</div>';
  }
  html += '</div>';
  document.getElementById('body').innerHTML += html;
}

// ── 🧪 로또 모의테스트 및 실험 (4개 게임 합산) ──
async function renderMocktest(){
  var html = '<div class="card"><h2>' + t('mocktestTitle') + '</h2>';
  try {
    var allItems = CACHE.mocktest;
    if (!allItems) {
      var games = ['KR','POWERBALL','MEGAMILLIONS','EUROMILLIONS'];
      var headers = await mllAuthHeaders();
      var results = await Promise.all(games.map(function(g){
        var qs = mllAuthQuery(['game_code=' + g]);
        return fetch(MLL.API_BASE + '/api/mocktest/entries' + qs, { headers: headers })
          .then(function(r){ return r.ok ? r.json() : { items: [] }; })
          .catch(function(){ return { items: [] }; });
      }));
      allItems = [].concat.apply([], results.map(function(r){ return r.items || []; }));
      CACHE.mocktest = allItems;
    }
    var graded = allItems.filter(function(e){ return e.status === 'graded'; });

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + allItems.length.toLocaleString() + '</div><div class="lbl">' + t('statSessions') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + graded.length.toLocaleString() + '</div><div class="lbl">' + t('statGraded') + '</div></div>' +
    '</div>';

    if (!allItems.length) html += '<div class="empty-state">' + t('noMocktest') + '</div>';
    html += '<div style="text-align:center;margin-top:12px;"><a href="mocktest_hub.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('goMocktest') + '</a></div>';
  } catch(e) {
    console.error('[my_page] mocktest error', e);
    html += '<div class="empty-state">' + t('fetchError') + '</div>';
  }
  html += '</div>';
  document.getElementById('body').innerHTML += html;
}

// ── 🌍 해외 발행 복권 3종 (Powerball / Mega Millions / EuroMillions) ──
async function renderGlobalLotto(){
  var html = '<div class="card"><h2>' + t('globalTitle') + '</h2>';
  try {
    var data = CACHE.global;
    if (!data) {
      var resp = await fetch(MLL.API_BASE + '/api/global/tickets' + mllAuthQuery(), { headers: await mllAuthHeaders() });
      data = await resp.json();
      CACHE.global = data;
    }
    var items = data.items || [];
    var wins = items.filter(function(e){ return e.prize_tier && e.prize_tier > 0; });
    var totalPrize = wins.reduce(function(s,e){ return s + Number(e.prize_amount||0); }, 0);
    var names = t('gameNames');

    var byGame = {};
    items.forEach(function(e){ byGame[e.game_code] = (byGame[e.game_code]||0) + 1; });
    var unitWord = LANG==='en' ? '' : '건';
    var gameDist = Object.keys(names).map(function(code){
      return names[code] + ' ' + (byGame[code]||0) + unitWord;
    }).join(' · ');

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + items.length.toLocaleString() + '</div><div class="lbl">' + t('statTotalReg') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + wins.length.toLocaleString() + '</div><div class="lbl">' + t('statWinCount') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + totalPrize.toLocaleString() + '</div><div class="lbl">' + t('statTotalPrizeVirtual') + '</div></div>' +
    '</div>';
    if (items.length) html += '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:10px;">' + gameDist + '</div>';

    if (items.length) {
      var recent = items.slice(0, 5);
      html += recent.map(function(e){
        var gname = names[e.game_code] || e.game_code;
        var gradeHtml;
        if (e.prize_tier === null || e.prize_tier === undefined) {
          gradeHtml = '<span style="color:var(--gold);">' + t('pending') + '</span>';
        } else if (e.prize_tier > 0) {
          var suffix = LANG==='en' ? t('gradeSuffix')(e.prize_tier) : t('gradeSuffix');
          gradeHtml = '<span style="color:var(--green);font-weight:700;">' + e.prize_tier + suffix + '</span>';
        } else {
          gradeHtml = '<span style="color:var(--text-faint);">' + t('lose') + '</span>';
        }
        return '<div class="recent-row"><span>' + gname + ' · ' + (e.draw_date||'-') + '</span>' +
          '<span style="color:var(--text-faint);font-size:10.5px;">' + (e.main_numbers||[]).join(',') + '</span>' +
          '<span>' + gradeHtml + '</span></div>';
      }).join('');
    } else {
      html += '<div class="empty-state">' + t('noGlobalEntries') + '</div>';
    }
    html += '<div style="text-align:center;margin-top:12px;"><a href="global_lotto.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('goGlobal') + '</a></div>';
  } catch(e) {
    console.error('[my_page] global-lotto error', e);
    html += '<div class="empty-state">' + t('fetchError') + '</div>';
  }
  html += '</div>';
  document.getElementById('body').innerHTML += html;
}

// ── 🪙 포인트 충전·사용 내역 ──
async function renderPointsHistory(){
  var html = '<div class="card"><h2>' + t('pointsTitle') + '</h2>';
  try {
    var lotsData = CACHE.pointsLots, histData = CACHE.pointsHistory;
    if (!lotsData || !histData) {
      var headers = await mllAuthHeaders();
      var qs = mllAuthQuery();
      var lotsResp = await fetch(MLL.API_BASE + '/api/points/lots' + qs, { headers: headers });
      lotsData = await lotsResp.json();
      CACHE.pointsLots = lotsData;
      var histResp = await fetch(MLL.API_BASE + '/api/points/history' + qs, { headers: headers });
      histData = await histResp.json();
      CACHE.pointsHistory = histData;
    }
    var total = lotsData.total || 0, deposit = lotsData.deposit || 0, activity = lotsData.activity || 0;

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + total.toLocaleString() + 'P</div><div class="lbl">' + t('statBalance') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + deposit.toLocaleString() + 'P</div><div class="lbl">' + t('statDeposit') + '</div></div>' +
      '<div class="stat-box"><div class="num">' + activity.toLocaleString() + 'P</div><div class="lbl">' + t('statActivity') + '</div></div>' +
    '</div>';

    var items = histData.items || [];
    var locale = LANG==='en' ? 'en-US' : 'ko-KR';

    html += '<div style="font-size:12.5px;font-weight:700;margin:14px 0 8px;color:var(--text-dim);">' + t('recentTxTitle') + '</div>';
    if (items.length) {
      var recent = items.slice(0, 8);
      html += recent.map(function(h){
        var when = new Date(h.at).toLocaleString(locale, { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        var isCredit = h.kind === 'credit';
        var amountHtml = '<span style="color:' + (isCredit ? 'var(--green)' : 'var(--text-dim)') + ';font-weight:700;">' + (isCredit?'+':'-') + h.amount.toLocaleString() + 'P</span>';
        return '<div class="recent-row"><span>' + h.label + '</span>' +
          '<span style="color:var(--text-faint);font-size:10.5px;">' + when + '</span>' +
          '<span>' + amountHtml + '</span></div>';
      }).join('');
    } else {
      html += '<div class="empty-state">' + t('noTx') + '</div>';
    }
    html += '<div style="text-align:center;margin-top:12px;"><a href="hub_lounge.html" style="font-size:12px;color:var(--gold);font-weight:700;">' + t('goLounge') + '</a></div>';
  } catch(e) {
    console.error('[my_page] points error', e);
    html += '<div class="empty-state">' + t('fetchError') + '</div>';
  }
  html += '</div>';
  document.getElementById('body').innerHTML += html;
}

function renderSoon(){
  if (!SOON_ITEMS.length) return;
  var html = '<div class="card"><h2>🚧 <span class="soon-badge"></span></h2><div class="soon-list">' +
    SOON_ITEMS.map(function(item){
      return '<div class="soon-card"><div class="ic">' + item.ic + '</div>' + item.label + '</div>';
    }).join('') +
  '</div></div>';
  document.getElementById('body').innerHTML += html;
}
