<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 새로 정하기 - My Lotto Lab</title>
<!-- 🔴 2026-10-14 신설: "비밀번호 찾기" 메일의 링크가 여기로 옵니다.
     Supabase → Authentication → URL Configuration → Redirect URLs 에
     https://mylottolab.github.io/my-lotto-lab/reset_password.html 이 들어 있어야 합니다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{ --bg:#0a0d18; --surface:#11152a; --border:#252b48; --text:#eef0f6; --dim:#8b91ab; --gold:#e0b341; --red:#e05c5c; --green:#3fb37f; }
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;}
h1{font-size:20px;margin-bottom:6px;}
p.sub{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:20px;}
label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 6px;}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0d1122;color:var(--text);font-size:16px;font-family:inherit;}
button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#1a1305;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}
button:disabled{opacity:.5;}
.msg{margin-top:14px;font-size:13px;line-height:1.6;min-height:20px;}
.msg.err{color:var(--red);} .msg.ok{color:var(--green);}
a{color:var(--gold);}
</style>
</head>
<body>
<div class="box">
  <h1 id="ttl">비밀번호 새로 정하기</h1>
  <p class="sub" id="sub">새 비밀번호를 두 번 입력해 주세요. 8자 이상이면 됩니다.</p>
  <div id="form">
    <label for="pw1" id="l1">새 비밀번호</label>
    <input type="password" id="pw1" autocomplete="new-password">
    <label for="pw2" id="l2">새 비밀번호 확인</label>
    <input type="password" id="pw2" autocomplete="new-password">
    <button type="button" id="go">바꾸기</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
var EN = (localStorage.getItem('mll_lang') || 'kr') === 'en';
function L(k, e){ return EN ? e : k; }
if (EN) {
  document.getElementById('ttl').textContent = 'Set a new password';
  document.getElementById('sub').textContent = 'Enter your new password twice (at least 8 characters).';
  document.getElementById('l1').textContent = 'New password';
  document.getElementById('l2').textContent = 'Confirm new password';
  document.getElementById('go').textContent = 'Change';
}
var sb = supabase.createClient('https://lgwzueyhtxiywoqwshxy.supabase.co', 'sb_publishable_7a7XwW2R64-2n5NEbYVCFg_zPj-iQ8a');
var msg = document.getElementById('msg');
function say(t, cls){ msg.textContent = t; msg.className = 'msg ' + (cls || ''); }

// 메일 링크의 열쇠(#access_token … type=recovery 또는 ?code=…)로 잠깐 로그인됩니다
var ready = false;
sb.auth.onAuthStateChange(function(ev, session){ if (session) ready = true; });
(async function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('code')) { await sb.auth.exchangeCodeForSession(q.get('code')); }
    var s = (await sb.auth.getSession()).data.session;
    if (s) ready = true;
  } catch (e) { console.warn(e); }
  setTimeout(function(){
    if (!ready) say(L('링크가 만료되었거나 이미 사용되었습니다. 로그인 화면의 "비밀번호 찾기"로 메일을 다시 받아 주세요.',
                      'This link has expired or was already used. Please request a new one from "Forgot password?" on the login page.'), 'err');
  }, 1500);
})();

document.getElementById('go').addEventListener('click', async function(){
  var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if (a.length < 8) { say(L('비밀번호는 8자 이상이어야 합니다.', 'Use at least 8 characters.'), 'err'); return; }
  if (a !== b) { say(L('두 비밀번호가 다릅니다.', 'The two passwords do not match.'), 'err'); return; }
  if (!ready) { say(L('링크가 만료되었습니다. 메일을 다시 받아 주세요.', 'The link has expired. Please request a new one.'), 'err'); return; }
  this.disabled = true;
  var r = await sb.auth.updateUser({ password: a });
  if (r.error) { this.disabled = false; say(L('바꾸지 못했습니다: ', 'Could not change: ') + r.error.message, 'err'); return; }
  try { await sb.auth.signOut(); } catch (e) {}
  document.getElementById('form').style.display = 'none';
  msg.innerHTML = '';
  say(L('비밀번호를 바꿨습니다. 새 비밀번호로 로그인해 주세요.', 'Password changed. Please log in with your new password.'), 'ok');
  var a2 = document.createElement('div'); a2.style.marginTop = '12px';
  a2.innerHTML = '<a href="login.html">' + L('로그인하러 가기 →', 'Go to login →') + '</a>';
  msg.appendChild(a2);
});
</script>
</body>
</html>
