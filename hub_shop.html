<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d18; --surface:#11152a; --surface-2:#161b35;
  --border:#252b48; --border-soft:#1b2038;
  --text:#eef0f6; --text-dim:#8b91ab; --text-faint:#5a6080;
  --gold:#e0b341; --gold-dim:#8a6f2f;
  --accent:#d4537e; --accent-bg:rgba(212,83,126,.14);
  --green:#3fb37f; --red:#e05555;
  --card-shadow:0 1px 2px rgba(0,0,0,.2);
  --card-shadow-hover:0 8px 20px rgba(0,0,0,.32);
  --bg-top:#0d1120;
}
body.light-mode{
  --bg:#dbe0ee; --surface:#ffffff; --surface-2:#eef1f9;
  --border:#c2c8dd; --border-soft:#d2d7e8;
  --text:#161b30; --text-dim:#4c5372; --text-faint:#7a80a0;
  --gold:#a8781f; --gold-dim:#8a6f2f;
  --accent:#b8436a; --accent-bg:rgba(184,67,106,.10);
  --green:#178072; --red:#c94040;
  --card-shadow:0 1px 2px rgba(30,36,66,.06);
  --card-shadow-hover:0 10px 24px rgba(30,36,66,.12);
  --bg-top:#e7eaf5;
}
body{
  background:var(--bg);
  background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 340px);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;
  font-size:14px;letter-spacing:-0.01em;min-height:100vh;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.topbar{border-bottom:1px solid var(--border-soft);background:var(--surface);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #f3d785, var(--gold) 60%, var(--gold-dim));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:17px;height:17px;stroke:#1a1404;stroke-width:1.8;fill:none;}
.brand-text .t1{font-size:15px;font-weight:600;letter-spacing:-0.02em;}
.brand-text .t2{font-size:10px;color:var(--text-faint);margin-top:1px;}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
.crumb a{cursor:pointer;}
.crumb a:hover{color:var(--text);}
.crumb .sep{color:var(--text-faint);}
.crumb .cur{color:var(--accent);}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;}
.theme-toggle:hover{border-color:var(--accent);}
.points-badge{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--gold);}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 70px;}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
.page-title{font-size:25px;font-weight:700;letter-spacing:-0.02em;margin-top:6px;}
.page-sub{font-size:12.5px;color:var(--text-dim);margin-top:8px;line-height:1.7;max-width:760px;}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px;}
@media (max-width:820px){.product-grid{grid-template-columns:1fr;}}
.product-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;box-shadow:var(--card-shadow);transition:border-color .15s,transform .12s;}
.product-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.pc-icon{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;}
.pc-name{font-size:15.5px;font-weight:700;}
.pc-desc{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.6;min-height:56px;}
.pc-btn{margin-top:14px;width:100%;padding:10px;border:none;border-radius:9px;background:var(--gold);color:#1a1305;font-size:13px;font-weight:700;cursor:pointer;}
.pc-btn:hover{filter:brightness(1.08);}

.section-title{font-size:15px;font-weight:700;margin-top:36px;margin-bottom:12px;}
.list-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow);}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12.5px;border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-row .lr-main{color:var(--text);font-weight:600;}
.list-row .lr-sub{color:var(--text-faint);font-size:11px;margin-top:2px;}
.list-empty{padding:30px 16px;text-align:center;color:var(--text-faint);font-size:12.5px;}

.back-row{margin-top:34px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.back-link:hover{color:var(--text);}

/* ── 구매 모달 ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,7,15,.65);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.modal-title{font-size:16px;font-weight:700;}
.modal-close{border:none;background:none;color:var(--text-dim);font-size:18px;cursor:pointer;}
.modal-desc{font-size:11.5px;color:var(--text-dim);margin-bottom:16px;line-height:1.6;}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.form-row label{font-size:12.5px;color:var(--text-dim);min-width:110px;}
.form-row input{width:100px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:13px;}
.char-section-title{font-size:12px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;}
.char-guide{font-size:11px;color:var(--gold);background:var(--accent-bg);border:1px solid var(--border-soft);border-radius:8px;padding:8px 11px;margin-bottom:10px;line-height:1.6;}
.char-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:260px;overflow-y:auto;padding:4px;border:1px solid var(--border-soft);border-radius:10px;margin-bottom:14px;}
@media (max-width:520px){.char-grid{grid-template-columns:repeat(3,1fr);}}
.char-card{cursor:pointer;border:2px solid var(--border);border-radius:8px;overflow:hidden;text-align:center;background:var(--surface-2);}
.char-card .cc-id{font-size:9px;padding:4px 2px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-card.on{border-color:var(--green);box-shadow:0 0 0 2px rgba(63,179,127,.3);}
.price-box{background:var(--surface-2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text-dim);margin-bottom:14px;line-height:1.7;}
.price-box b{color:var(--gold);font-size:16px;}
.purchase-btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.purchase-btn:hover{filter:brightness(1.06);}
.purchase-btn:disabled{opacity:.5;cursor:not-allowed;}
.result-box{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:12px;display:none;}

@media (max-width:680px){
  .topbar-inner{height:auto;min-height:54px;padding:10px 16px;}
  .brand-text .t2{display:none;}
}
</style>
</head>

var THEME = localStorage.getItem('mll_theme');
if (!THEME) { THEME = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
function applyTheme(){
  document.body.classList.toggle('light-mode', THEME === 'light');
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = THEME === 'light' ? '☀️' : '🌙';
}
function toggleTheme(){ THEME = (THEME === 'light') ? 'dark' : 'light'; localStorage.setItem('mll_theme', THEME); applyTheme(); }
applyTheme();

var LANG = localStorage.getItem('mll_lang') || 'kr';
function applyLang(){
  document.querySelectorAll('[data-i18n-kr]').forEach(function(el){
    var t = (LANG === 'en') ? el.dataset.i18nEn : el.dataset.i18nKr;
    if (t !== undefined) el.textContent = t;
  });
  var krBtn = document.getElementById('langKrBtn'), enBtn = document.getElementById('langEnBtn');
  if (krBtn) { krBtn.style.background = LANG==='kr' ? 'var(--gold)' : 'var(--surface)'; krBtn.style.color = LANG==='kr' ? '#1a1305' : 'var(--text-dim)'; }
  if (enBtn) { enBtn.style.background = LANG==='en' ? 'var(--gold)' : 'var(--surface)'; enBtn.style.color = LANG==='en' ? '#1a1305' : 'var(--text-dim)'; }
  renderProducts(); renderMyOrders();
}
function setLang(lang){ LANG = lang; localStorage.setItem('mll_lang', lang); applyLang(); }

function authHeaders(){
  var state = MLL.getAuthState();
  var h = { 'Content-Type': 'application/json' };
  if (state.type === 'member') h['Authorization'] = 'Bearer ' + state.token;
  return h;
}
function authBodyExtra(){
  var state = MLL.getAuthState();
  if (state.type === 'guest') return { nickname: state.nickname, email: state.email };
  return {};
}

var PRODUCTS = [];
var PRODUCT_ICON = { unique_combos:'🎯', repeat_marked:'🔁', past_winners:'🕰️', extreme_combos:'🎲', blank_sheet:'📄' };
var PRICING = { pricePerCombo: 100, pricePerBlankPage: 1000 };
var SELECTED_CIDS = [];
var CURRENT_PRODUCT = null;

async function loadPricing(){
  try {
    var resp = await fetch(MLL.API_BASE + '/api/shop/pricing');
    PRICING = await resp.json();
  } catch(e){ console.error('[shop] pricing load error', e); }
}

async function loadProducts(){
  try {
    var resp = await fetch(MLL.API_BASE + '/api/shop/products');
    var data = await resp.json();
    PRODUCTS = data.items || [];
    renderProducts();
  } catch(e){ console.error('[shop] products load error', e); }
}

function renderProducts(){
  var grid = document.getElementById('productGrid');
  if (!PRODUCTS.length) { grid.innerHTML = '<div class="list-empty">' + (LANG==='en'?'No products.':'상품이 없습니다.') + '</div>'; return; }
  grid.innerHTML = PRODUCTS.map(function(p){
    var name = LANG==='en' ? p.name_en : p.name_kr;
    var desc = LANG==='en' ? p.desc_en : p.desc_kr;
    return '<div class="product-card">' +
      '<div class="pc-icon">' + (PRODUCT_ICON[p.id] || '🖨️') + '</div>' +
      '<div class="pc-name">' + name + '</div>' +
      '<div class="pc-desc">' + desc + '</div>' +
      '<button class="pc-btn" onclick="openPurchaseModal(\'' + p.id + '\')">' + (LANG==='en'?'Buy':'구매하기') + '</button>' +
    '</div>';
  }).join('');
}

async function loadPoints(){
  var state = MLL.getAuthState();
  if (!state.type) { document.getElementById('pointsBalance').textContent = '0'; return; }
  try {
    var qs = '';
    if (state.type === 'guest') qs = '?nickname=' + encodeURIComponent(state.nickname) + '&email=' + encodeURIComponent(state.email);
    var resp = await fetch(MLL.API_BASE + '/api/points/balance' + qs, { headers: authHeaders() });
    var data = await resp.json();
    document.getElementById('pointsBalance').textContent = (data.total || 0).toLocaleString();
  } catch(e){ console.error('[shop] points load error', e); }
}

async function loadMyOrders(){
  var state = MLL.getAuthState();
  var el = document.getElementById('myOrdersList');
  if (!state.type) { el.innerHTML = '<div class="list-empty">' + ((LANG==='en')?'Log in or register as a guest to view this':'로그인 또는 비회원 등록 후 이용 가능합니다') + '</div>'; return; }
  try {
    var qs = '';
    if (state.type === 'guest') qs = '?nickname=' + encodeURIComponent(state.nickname) + '&email=' + encodeURIComponent(state.email);
    var resp = await fetch(MLL.API_BASE + '/api/shop/my-orders' + qs, { headers: authHeaders() });
    var data = await resp.json();
    renderMyOrdersData(data.items || []);
  } catch(e){ console.error('[shop] my-orders load error', e); }
}
var MY_ORDERS_CACHE = [];
function renderMyOrdersData(items){ MY_ORDERS_CACHE = items; renderMyOrders(); }
function renderMyOrders(){
  var el = document.getElementById('myOrdersList');
  var state = MLL.getAuthState();
  if (!state.type) return;
  if (!MY_ORDERS_CACHE.length) { el.innerHTML = '<div class="list-empty">' + ((LANG==='en')?'No purchases yet.':'아직 구매내역이 없습니다.') + '</div>'; return; }
  el.innerHTML = MY_ORDERS_CACHE.map(function(o){
    var p = PRODUCTS.find(function(x){ return x.id === o.product_id; });
    var name = p ? (LANG==='en'?p.name_en:p.name_kr) : o.product_id;
    var qtyStr = o.page_count ? (o.page_count + (LANG==='en'?' pages':'페이지')) : (o.combo_count + (LANG==='en'?' combos':'게임'));
    return '<div class="list-row"><div><div class="lr-main">' + name + ' · ' + qtyStr + '</div><div class="lr-sub">' + new Date(o.created_at).toLocaleString(LANG==='en'?'en-US':'ko-KR') + '</div></div><div>-' + o.points_charged.toLocaleString() + 'P</div></div>';
  }).join('');
}

// ── 구매 모달 ──
function openPurchaseModal(productId){
  var state = MLL.getAuthState();
  if (!state.type) { alert((LANG==='en')?'Please log in or register as a guest first.':'먼저 로그인 또는 비회원 등록을 해주세요.'); return; }

  CURRENT_PRODUCT = PRODUCTS.find(function(p){ return p.id === productId; });
  if (!CURRENT_PRODUCT) return;
  SELECTED_CIDS = [];

  document.getElementById('pmTitle').textContent = LANG==='en' ? CURRENT_PRODUCT.name_en : CURRENT_PRODUCT.name_kr;
  document.getElementById('pmDesc').textContent = LANG==='en' ? CURRENT_PRODUCT.desc_en : CURRENT_PRODUCT.desc_kr;
  document.getElementById('pmResultBox').style.display = 'none';

  var fieldsHtml = '';
  if (productId === 'repeat_marked') {
    fieldsHtml =
      '<div class="form-row"><label>' + (LANG==='en'?'Distinct combos':'서로다른 조합수') + '</label><input type="number" id="pmComboCount" min="1" value="5" oninput="updateQuote()"></div>' +
      '<div class="form-row"><label>' + (LANG==='en'?'Repeat count':'반복 횟수') + '</label><input type="number" id="pmRepeatCount" min="1" value="3" oninput="updateQuote()"></div>';
  } else if (productId === 'blank_sheet') {
    fieldsHtml = '<div class="form-row"><label>' + (LANG==='en'?'Pages (A4)':'매수(A4 페이지)') + '</label><input type="number" id="pmPageCount" min="1" value="1" oninput="updateQuote()"></div>';
  } else {
    fieldsHtml = '<div class="form-row"><label>' + (LANG==='en'?'Quantity':'조합 개수') + '</label><input type="number" id="pmComboCount" min="1" value="10" oninput="updateQuote()"></div>';
  }
  document.getElementById('pmFormFields').innerHTML = fieldsHtml;

  renderCharGrid();
  updateQuote();
  document.getElementById('purchaseModal').classList.add('show');
}
function closePurchaseModal(){ document.getElementById('purchaseModal').classList.remove('show'); }

function currentEstimatedRowCount(){
  if (!CURRENT_PRODUCT) return 0;
  if (CURRENT_PRODUCT.id === 'repeat_marked') {
    var n = Number(document.getElementById('pmComboCount').value) || 0;
    var N = Number(document.getElementById('pmRepeatCount').value) || 0;
    return n * N;
  }
  if (CURRENT_PRODUCT.id === 'blank_sheet') {
    var pages = Number(document.getElementById('pmPageCount').value) || 0;
    return pages * 15;
  }
  var c = document.getElementById('pmComboCount');
  return c ? (Number(c.value) || 0) : 0;
}

function renderCharGrid(){
  var rowCount = Math.max(1, currentEstimatedRowCount());
  var maxUsefulImages = Math.max(1, Math.ceil(rowCount / 15));
  document.getElementById('pmCharGuide').textContent =
    (LANG==='en')
      ? ('You can pick up to ' + maxUsefulImages + ' image(s) for this quantity (images change every 15 marks).')
      : ('지금 수량 기준으로 이미지 ' + maxUsefulImages + '개까지 고를 수 있어요 (15게임 단위로만 이미지가 바뀜).');

  var ids = Object.keys(MLL_CHAR_NAMES).map(Number).sort(function(a,b){return a-b;});
  var grid = document.getElementById('pmCharGrid');
  grid.innerHTML = ids.map(function(id){
    var name = MLL_CHAR_NAMES[String(id)] || '';
    return '<div class="char-card" data-cid="' + id + '" onclick="toggleChar(' + id + ')">' +
      '<img src="' + id + '.png" style="width:100%;aspect-ratio:2/1;object-fit:cover;display:block;" loading="lazy">' +
      '<div class="cc-id">' + id + (name ? (' ' + name.slice(0,6)) : '') + '</div>' +
    '</div>';
  }).join('');
}

function toggleChar(cid){
  var rowCount = Math.max(1, currentEstimatedRowCount());
  var maxUsefulImages = Math.max(1, Math.ceil(rowCount / 15));
  var idx = SELECTED_CIDS.indexOf(cid);
  if (idx >= 0) {
    SELECTED_CIDS.splice(idx, 1);
  } else {
    if (SELECTED_CIDS.length >= maxUsefulImages) {
      alert((LANG==='en') ? ('You can only use up to ' + maxUsefulImages + ' image(s) for this quantity.') : ('지금 수량으로는 이미지를 최대 ' + maxUsefulImages + '개까지만 쓸 수 있어요.'));
      return;
    }
    SELECTED_CIDS.push(cid);
  }
  document.querySelectorAll('.char-card').forEach(function(el){
    el.classList.toggle('on', SELECTED_CIDS.indexOf(parseInt(el.dataset.cid)) >= 0);
  });
}

async function updateQuote(){
  if (!CURRENT_PRODUCT) return;
  renderCharGrid();
  var params = buildParams();
  try {
    var resp = await fetch(MLL.API_BASE + '/api/shop/quote', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ productId: CURRENT_PRODUCT.id, params: params })
    });
    var data = await resp.json();
    if (!resp.ok) {
      document.getElementById('pmPriceBox').innerHTML = '<span style="color:var(--red);">' + (data.error || '오류') + '</span>';
      document.getElementById('pmPurchaseBtn').disabled = true;
      return;
    }
    var qtyLabel = data.pageCount ? (data.pageCount + (LANG==='en'?' pages':'페이지')) : (data.comboCount + (LANG==='en'?' combos':'게임'));
    document.getElementById('pmPriceBox').innerHTML =
      qtyLabel + ' → <b>' + data.amount.toLocaleString() + 'P</b>';
    document.getElementById('pmPurchaseBtn').disabled = false;
  } catch(e){
    console.error('[shop] quote error', e);
  }
}

function buildParams(){
  if (CURRENT_PRODUCT.id === 'repeat_marked') {
    return { comboCount: Number(document.getElementById('pmComboCount').value) || 0, repeatCount: Number(document.getElementById('pmRepeatCount').value) || 0 };
  }
  if (CURRENT_PRODUCT.id === 'blank_sheet') {
    return { pageCount: Number(document.getElementById('pmPageCount').value) || 0 };
  }
  return { comboCount: Number(document.getElementById('pmComboCount').value) || 0 };
}

async function doPurchase(){
  if (!CURRENT_PRODUCT) return;
  var btn = document.getElementById('pmPurchaseBtn');
  btn.disabled = true;
  btn.textContent = (LANG==='en') ? 'Generating...' : '생성 중...';
  var resultBox = document.getElementById('pmResultBox');
  resultBox.style.display = 'none';

  var body = Object.assign({ productId: CURRENT_PRODUCT.id, params: buildParams(), cids: SELECTED_CIDS }, authBodyExtra());
  try {
    var resp = await fetch(MLL.API_BASE + '/api/shop/purchase', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
    });
    if (!resp.ok) {
      var errData = await resp.json().catch(function(){ return {}; });
      throw new Error(errData.error || ('서버 오류 (코드 ' + resp.status + ')'));
    }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = CURRENT_PRODUCT.id + '_마킹용지.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    resultBox.style.display = 'block';
    resultBox.style.background = 'rgba(63,179,127,.1)';
    resultBox.style.border = '1px solid rgba(63,179,127,.25)';
    resultBox.style.color = 'var(--green)';
    resultBox.textContent = (LANG==='en') ? '✅ Purchase complete! PDF downloaded.' : '✅ 구매 완료! PDF가 다운로드됐습니다.';
    loadPoints(); loadMyOrders();
  } catch(e){
    console.error('[shop] purchase error', e);
    resultBox.style.display = 'block';
    resultBox.style.background = 'rgba(224,85,85,.1)';
    resultBox.style.border = '1px solid rgba(224,85,85,.25)';
    resultBox.style.color = 'var(--red)';
    resultBox.textContent = '⚠️ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = (LANG==='en') ? 'Buy & Download' : '구매하고 다운로드';
  }
}

document.addEventListener('DOMContentLoaded', function(){
  applyLang();
  loadPricing();
  loadProducts();
  loadPoints();
  loadMyOrders();
});
</script>
